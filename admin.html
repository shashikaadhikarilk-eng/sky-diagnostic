<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Admin Helpdesk Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at top, #0b140d 0%, #05080a 50%, #020304 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .sky-glass-card {
      background: rgba(10, 18, 14, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
    }
    .ticket-card {
      background: rgba(5, 12, 8, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.3);
      transition: all 0.2s ease-in-out;
    }
    .ticket-card:hover {
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="p-3 sm:p-6">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="max-w-md mx-auto mt-20 sky-glass-card rounded-2xl p-8 text-center space-y-6">
    <div>
      <h2 class="font-brand text-2xl font-bold text-green-400">ADMIN LOGIN</h2>
      <p class="text-xs text-gray-400 mt-1">SKY TECHNOLOGIES HELPDESK</p>
    </div>
    <form onsubmit="checkPassword(event)" class="space-y-4">
      <input type="password" id="adminPassword" placeholder="Enter Password (sky123)" class="w-full bg-black border border-green-500/40 rounded-xl px-4 py-3 text-sm text-center text-green-400 outline-none focus:border-green-400" required>
      <button type="submit" class="w-full font-brand bg-gradient-to-r from-green-500 to-emerald-600 text-black font-bold py-3 rounded-xl hover:from-green-400 hover:to-emerald-500 transition cursor-pointer text-sm">
        LOGIN
      </button>
      <p id="loginError" class="text-xs text-red-400 font-bold hidden">Incorrect Password! Password is sky123</p>
    </form>
  </div>

  <!-- DASHBOARD MAIN CONTAINER -->
  <div id="dashboardContent" class="max-w-[1600px] mx-auto space-y-5 hidden">
    <div class="sky-glass-card rounded-2xl p-4 sm:p-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="font-brand text-xl sm:text-2xl font-extrabold text-white">SKY <span class="text-green-500">TECHNOLOGIES</span></h1>
        <p class="text-xs font-bold text-cyan-400 uppercase tracking-widest">REPAIR HELPDESK KANBAN SYSTEM</p>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="fetchTickets()" class="w-full md:w-auto font-brand bg-green-500 text-black font-extrabold px-5 py-2.5 rounded-xl text-xs hover:bg-green-400">🔄 REFRESH DATA</button>
        <button onclick="logout()" class="font-brand bg-red-950 border border-red-500/50 text-red-400 font-bold px-4 py-2.5 rounded-xl text-xs hover:bg-red-900">LOGOUT</button>
      </div>
    </div>

    <!-- Mobile View Filter Tabs -->
    <div class="md:hidden flex overflow-x-auto gap-2 pb-2 text-xs font-bold">
      <button onclick="switchMobileTab('col-new-wrapper')" class="bg-cyan-950 border border-cyan-500/50 text-cyan-400 px-3 py-2 rounded-lg whitespace-nowrap">🆕 New (<span id="mob-count-new">0</span>)</button>
      <button onclick="switchMobileTab('col-process-wrapper')" class="bg-yellow-950 border border-yellow-500/50 text-yellow-400 px-3 py-2 rounded-lg whitespace-nowrap">⚙️ Process (<span id="mob-count-process">0</span>)</button>
      <button onclick="switchMobileTab('col-parts-wrapper')" class="bg-orange-950 border border-orange-500/50 text-orange-400 px-3 py-2 rounded-lg whitespace-nowrap">⏳ Parts (<span id="mob-count-parts">0</span>)</button>
      <button onclick="switchMobileTab('col-ready-wrapper')" class="bg-green-950 border border-green-500/50 text-green-400 px-3 py-2 rounded-lg whitespace-nowrap">✅ Ready (<span id="mob-count-ready">0</span>)</button>
      <button onclick="switchMobileTab('col-completed-wrapper')" class="bg-slate-900 border border-slate-600/50 text-slate-400 px-3 py-2 rounded-lg whitespace-nowrap">🏁 Done (<span id="mob-count-completed">0</span>)</button>
    </div>

    <div id="loading" class="sky-glass-card rounded-2xl p-12 text-center text-cyan-400 font-bold tracking-widest text-sm animate-pulse">
      FETCHING TICKETS FROM GOOGLE SHEETS...
    </div>

    <div id="board" class="hidden grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 items-start">
      <div id="col-new-wrapper" class="kanban-wrapper sky-glass-card rounded-xl p-3 space-y-3">
        <div class="flex justify-between items-center pb-2 border-b border-cyan-900/50">
          <h2 class="font-bold text-xs text-cyan-400 uppercase">🆕 New Tickets</h2>
          <span id="count-new" class="bg-cyan-950 border border-cyan-500/40 text-cyan-300 text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-new" class="space-y-3 min-h-[50vh]"></div>
      </div>

      <div id="col-process-wrapper" class="kanban-wrapper sky-glass-card rounded-xl p-3 space-y-3 hidden md:block">
        <div class="flex justify-between items-center pb-2 border-b border-yellow-900/50">
          <h2 class="font-bold text-xs text-yellow-400 uppercase">⚙️ In Process</h2>
          <span id="count-process" class="bg-yellow-950 border border-yellow-500/40 text-yellow-300 text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-process" class="space-y-3 min-h-[50vh]"></div>
      </div>

      <div id="col-parts-wrapper" class="kanban-wrapper sky-glass-card rounded-xl p-3 space-y-3 hidden md:block">
        <div class="flex justify-between items-center pb-2 border-b border-orange-900/50">
          <h2 class="font-bold text-xs text-orange-400 uppercase">⏳ Parts Pending</h2>
          <span id="count-parts" class="bg-orange-950 border border-orange-500/40 text-orange-300 text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-parts" class="space-y-3 min-h-[50vh]"></div>
      </div>

      <div id="col-ready-wrapper" class="kanban-wrapper sky-glass-card rounded-xl p-3 space-y-3 hidden md:block">
        <div class="flex justify-between items-center pb-2 border-b border-green-900/50">
          <h2 class="font-bold text-xs text-green-400 uppercase">✅ Ready For Collect</h2>
          <span id="count-ready" class="bg-green-950 border border-green-500/40 text-green-300 text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-ready" class="space-y-3 min-h-[50vh]"></div>
      </div>

      <div id="col-completed-wrapper" class="kanban-wrapper sky-glass-card rounded-xl p-3 space-y-3 hidden md:block">
        <div class="flex justify-between items-center pb-2 border-b border-slate-800">
          <h2 class="font-bold text-xs text-slate-400 uppercase">🏁 Completed</h2>
          <span id="count-completed" class="bg-slate-900 border border-slate-700 text-slate-300 text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-completed" class="space-y-3 min-h-[50vh]"></div>
      </div>
    </div>
  </div>

  <!-- WHATSAPP MODAL -->
  <div id="whatsappModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="sky-glass-card max-w-lg w-full rounded-2xl p-6 space-y-4 border border-green-500/50 shadow-2xl">
      <div class="flex justify-between items-center border-b border-green-900/50 pb-3">
        <h3 class="font-brand text-green-400 font-bold text-sm">💬 WHATSAPP CHAT</h3>
        <button onclick="closeWaModal()" class="text-gray-400 hover:text-white font-bold text-lg">✕</button>
      </div>
      <div class="space-y-2 text-xs">
        <div class="text-gray-300">Customer: <span id="modalCustomerName" class="text-white font-bold"></span></div>
        <div class="text-gray-300">Phone: <span id="modalPhoneNumber" class="text-cyan-400 font-mono font-bold"></span></div>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-semibold">EDIT MESSAGE:</label>
        <textarea id="modalMsgText" rows="6" class="w-full bg-black text-green-300 border border-green-900 rounded-xl p-3 text-xs outline-none font-sans leading-relaxed"></textarea>
      </div>
      <div class="flex gap-3">
        <button onclick="closeWaModal()" class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2.5 rounded-xl text-xs">CANCEL</button>
        <button onclick="sendWaNow()" class="w-2/3 bg-green-500 hover:bg-green-400 text-black font-extrabold py-2.5 rounded-xl text-xs">🚀 SEND MESSAGE</button>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-a41lxYfOWckO4LuTqUWKLYQOYfqRQvc_TO4DjtsNQvRQl8gi3LUmujni8jbranbXsw/exec';
    const SECRET_PASS = "sky123";
    let currentTargetPhone = "";

    window.onload = function() {
      if(localStorage.getItem('skyAdminAuth') === 'true') {
        showDashboard();
      }
    };

    function checkPassword(e) {
      if(e) e.preventDefault();
      const inputPass = document.getElementById('adminPassword').value.trim();
      if(inputPass === SECRET_PASS) {
        localStorage.setItem('skyAdminAuth', 'true');
        showDashboard();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardContent').classList.remove('hidden');
      fetchTickets();
    }

    function logout() {
      localStorage.removeItem('skyAdminAuth');
      location.reload();
    }

    function fetchTickets() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('board').classList.add('hidden');

      fetch(scriptURL)
        .then(res => res.json())
        .then(tickets => {
          renderBoard(tickets);
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('board').classList.remove('hidden');
        })
        .catch(err => {
          console.error(err);
          alert("Error fetching tickets!");
        });
    }

    function renderBoard(tickets) {
      const cols = {
        'New Ticket': { el: document.getElementById('col-new'), count: 0, countEl: document.getElementById('count-new'), mobCountEl: document.getElementById('mob-count-new') },
        'In Process': { el: document.getElementById('col-process'), count: 0, countEl: document.getElementById('count-process'), mobCountEl: document.getElementById('mob-count-process') },
        'Parts Pending': { el: document.getElementById('col-parts'), count: 0, countEl: document.getElementById('count-parts'), mobCountEl: document.getElementById('mob-count-parts') },
        'Ready For Pickup': { el: document.getElementById('col-ready'), count: 0, countEl: document.getElementById('count-ready'), mobCountEl: document.getElementById('mob-count-ready') },
        'Completed': { el: document.getElementById('col-completed'), count: 0, countEl: document.getElementById('count-completed'), mobCountEl: document.getElementById('mob-count-completed') }
      };

      Object.values(cols).forEach(c => c.el.innerHTML = '');

      if(!Array.isArray(tickets)) return;

      tickets.reverse().forEach(t => {
        const currentStatus = t.status || 'New Ticket';
        if (!cols[currentStatus]) return;

        cols[currentStatus].count++;

        const card = document.createElement('div');
        card.className = 'ticket-card rounded-xl p-3.5 space-y-2 text-xs relative';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-brand text-green-400 font-bold">${t.ticketNumber}</span>
            <span class="bg-black border border-green-900/50 text-cyan-300 text-[10px] px-2 py-0.5 rounded">${t.deviceType}</span>
          </div>
          <div class="text-sm font-bold text-white">${t.customerName}</div>
          <div class="text-cyan-300 font-mono">📞 ${t.phoneNumber}</div>
          <div class="text-gray-300"><span class="text-gray-400">Model:</span> ${t.deviceModel}</div>
          <div class="text-gray-400 font-mono text-[11px]"><span class="text-gray-500">S/N:</span> ${t.serialNumber}</div>
          <div class="p-2 bg-black/50 border border-red-900/30 rounded-lg text-amber-300/90 text-[11px]">
            <span class="font-bold text-red-400">Fault:</span> ${t.faultDescription}
          </div>
          <div class="pt-2 border-t border-green-900/30 space-y-2">
            <div>
              <label class="block text-[10px] text-gray-400 mb-1 font-semibold">CHANGE STATUS:</label>
              <select onchange="updateStatus(${t.rowIndex}, this.value)" class="w-full bg-black text-cyan-300 border border-green-900/60 rounded-lg px-2.5 py-1.5 text-xs outline-none">
                <option value="New Ticket" ${currentStatus === 'New Ticket' ? 'selected' : ''}>🆕 New Ticket</option>
                <option value="In Process" ${currentStatus === 'In Process' ? 'selected' : ''}>⚙️ In Process</option>
                <option value="Parts Pending" ${currentStatus === 'Parts Pending' ? 'selected' : ''}>⏳ Parts Pending</option>
                <option value="Ready For Pickup" ${currentStatus === 'Ready For Pickup' ? 'selected' : ''}>✅ Ready For Collect</option>
                <option value="Completed" ${currentStatus === 'Completed' ? 'selected' : ''}>🏁 Completed</option>
              </select>
            </div>
            <button onclick="openWaModal('${t.phoneNumber}', '${t.customerName}', '${t.ticketNumber}', '${currentStatus}', '${t.deviceModel}')" 
                    class="w-full font-bold bg-green-500/20 border border-green-500/50 hover:bg-green-500 hover:text-black text-green-300 py-2 rounded-lg transition text-[11px] flex items-center justify-center gap-1.5 cursor-pointer">
              💬 QUICK WHATSAPP CHAT
            </button>
          </div>
        `;
        cols[currentStatus].el.appendChild(card);
      });

      Object.values(cols).forEach(c => {
        c.countEl.innerText = c.count;
        if(c.mobCountEl) c.mobCountEl.innerText = c.count;
      });
    }

    function updateStatus(rowIndex, newStatus) {
      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateStatus', rowIndex: rowIndex, status: newStatus })
      })
      .then(res => res.json())
      .then(data => {
        if(data.result === 'success') fetchTickets();
      });
    }

    function openWaModal(phone, name, ticket, status, model) {
      let cleanPhone = phone.replace(/[^0-9]/g, '');
      if (cleanPhone.startsWith('0')) cleanPhone = '94' + cleanPhone.substring(1);
      currentTargetPhone = cleanPhone;
      document.getElementById('modalCustomerName').innerText = name;
      document.getElementById('modalPhoneNumber').innerText = phone;

      let statusMsg = `🛠️ *SKY TECHNOLOGIES STATUS UPDATE*\n\nHello ${name},\nYour device (${model}) under Ticket *${ticket}* Status: *${status}*.\n\nඔබගේ උපකරණයේ වර්තමාන තත්ත්වය: ${status}`;
      document.getElementById('modalMsgText').value = statusMsg;
      document.getElementById('whatsappModal').classList.remove('hidden');
    }

    function closeWaModal() {
      document.getElementById('whatsappModal').classList.add('hidden');
    }

    function sendWaNow() {
      const msg = document.getElementById('modalMsgText').value;
      window.open(`https://wa.me/${currentTargetPhone}?text=${encodeURIComponent(msg)}`, '_blank');
      closeWaModal();
    }

    function switchMobileTab(targetId) {
      const wrappers = document.querySelectorAll('.kanban-wrapper');
      wrappers.forEach(w => w.classList.add('hidden'));
      document.getElementById(targetId).classList.remove('hidden');
      document.getElementById(targetId).classList.add('block');
    }
  </script>
</body>
</html>
