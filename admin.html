<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Helpdesk Kanban Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #090d12; color: #e2e8f0; min-height: 100vh; }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .ticket-card { background: #111822; border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.2s; }
    .ticket-card:hover { border-color: #22c55e; }
  </style>
</head>
<body class="p-4 flex flex-col h-screen overflow-hidden">

  <!-- Header Section -->
  <header class="bg-[#111822] border border-gray-800 rounded-xl p-4 mb-4 flex flex-col sm:flex-row justify-between items-center gap-3">
    <div class="flex items-center gap-3">
      <h1 class="font-brand text-base sm:text-lg font-bold text-white">SKY <span class="text-green-500">TECHNOLOGIES</span> KANBAN</h1>
    </div>

    <!-- Search Bar -->
    <div class="w-full sm:w-72">
      <input type="text" id="searchInput" onkeyup="filterTickets()" placeholder="Search by name, ticket, device..." class="w-full bg-black/80 border border-gray-700 text-white text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-green-500">
    </div>

    <button onclick="fetchTickets()" class="bg-green-500 hover:bg-green-400 text-black text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-2 cursor-pointer">
      <i class="fa-solid fa-rotate-right"></i> REFRESH
    </button>
  </header>

  <!-- Kanban Board Container -->
  <main id="kanbanBoard" class="flex-1 flex gap-4 overflow-x-auto pb-2 items-start">
    <div class="w-full text-center py-20 text-green-400 font-brand">
      <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
      <p>LOADING TICKETS...</p>
    </div>
  </main>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxDt4gW4SA7bvfT399hUvhHJlfPfgagv6YjHF188jhSCRziyZRvTy4qynntbWGBfgs/exec';
    const columnsBase = ["New Ticket", "In Process", "On Hold", "Parts Pending", "Ready For Collect", "Delivered"];
    let globalTickets = [];

    function updateTicketStatus(rowIndex, newStatus) {
      const ticket = globalTickets.find(t => t.rowIndex === rowIndex);
      if (ticket) ticket.status = newStatus;
      renderBoard(globalTickets);

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateStatus', rowIndex: rowIndex, status: newStatus })
      }).catch(err => console.error("Status update error:", err));
    }

    function sendWhatsAppUpdate(phone, msgId) {
      const msg = document.getElementById(msgId).value;
      const nodeRedUrl = 'https://luckless-predict-footboard.ngrok-free.dev/kanban-whatsapp';

      fetch(nodeRedUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, message: msg })
      })
      .then(() => alert("WhatsApp පණිවිඩය සාර්ථකව යවන ලදී!"))
      .catch(err => {
        console.error(err);
        alert("Node-RED වෙත සම්බන්ධ වීමේදී දෝෂයක් ඇති විය.");
      });
    }

    function filterTickets() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = globalTickets.filter(tk => 
        (tk.customerName && tk.customerName.toLowerCase().includes(query)) ||
        (tk.ticketNumber && tk.ticketNumber.toLowerCase().includes(query)) ||
        (tk.deviceModel && tk.deviceModel.toLowerCase().includes(query)) ||
        (tk.deviceType && tk.deviceType.toLowerCase().includes(query))
      );
      renderBoard(filtered);
    }

    function renderBoard(data) {
      const board = document.getElementById('kanbanBoard');
      if (!data || data.length === 0) {
        board.innerHTML = `<div class="text-center w-full py-10 text-gray-400 font-brand">No Tickets Found.</div>`;
        return;
      }

      let html = "";
      columnsBase.forEach(col => {
        const filtered = data.filter(t => (t.status || "New Ticket").trim().toLowerCase() === col.toLowerCase());
        
        html += `
          <div class="w-80 flex-shrink-0 bg-[#0d131d] border border-gray-800 rounded-xl flex flex-col h-full max-h-full">
            <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-[#111822] rounded-t-xl">
              <span class="font-bold text-xs text-green-400">${col}</span>
              <span class="text-xs bg-gray-800 text-white px-2 py-0.5 rounded-full font-mono">${filtered.length}</span>
            </div>
            <div class="p-2 flex-1 overflow-y-auto space-y-2.5">
        `;

        if (filtered.length === 0) {
          html += `<div class="text-center py-6 text-gray-600 text-xs italic">No tickets</div>`;
        } else {
          filtered.slice().reverse().forEach(tk => {
            html += `
              <div class="ticket-card p-3 rounded-lg text-xs space-y-2">
                <div>
                  <div class="font-brand font-bold text-green-400">${tk.deviceType} - ${tk.deviceModel}</div>
                  <div class="text-gray-400 text-[10px] font-mono">${tk.ticketNumber}</div>
                  <div class="text-white font-semibold mt-1">${tk.customerName}</div>
                  <div class="text-gray-400 text-[11px] truncate"><i class="fa-solid fa-wrench mr-1"></i>${tk.faultDescription || '-'}</div>
                </div>
                <div class="pt-2 border-t border-gray-800 space-y-2">
                  <select onchange="updateTicketStatus(${tk.rowIndex}, this.value)" class="w-full bg-black text-green-300 p-1 rounded border border-gray-700 cursor-pointer">
                    ${columnsBase.map(c => `<option value="${c}" ${c === col ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                  <textarea id="msg-${tk.rowIndex}" class="w-full bg-black/90 text-gray-200 p-1.5 rounded border border-gray-700" rows="2">ආයුබෝවන් ${tk.customerName}, ඔබගේ ${tk.deviceType} අලුත්වැඩියා කටයුතු දැන් (${col}) තත්වයේ පවතී. - SKY TECHNOLOGIES</textarea>
                  <div class="flex justify-between items-center pt-1">
                    <span class="text-[10px] text-gray-400 font-mono"><i class="fa-solid fa-phone mr-1"></i>${tk.phoneNumber}</span>
                    <button onclick="sendWhatsAppUpdate('${tk.phoneNumber}', 'msg-${tk.rowIndex}')" class="bg-green-600 hover:bg-green-500 text-black font-bold px-2.5 py-1 rounded transition text-[10px] flex items-center gap-1 cursor-pointer">
                      <i class="fa-brands fa-whatsapp"></i> SEND
                    </button>
                  </div>
                </div>
              </div>
            `;
          });
        }
        html += `</div></div>`;
      });
      board.innerHTML = html;
    }

    function fetchTickets() {
      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          globalTickets = data;
          renderBoard(globalTickets);
        })
        .catch(err => {
          console.error(err);
          document.getElementById('kanbanBoard').innerHTML = `<div class="text-center w-full py-10 text-red-400">Failed to load tickets.</div>`;
        });
    }

    // Load tickets on start and auto-refresh every 30 seconds
    window.addEventListener('DOMContentLoaded', () => {
      fetchTickets();
      setInterval(fetchTickets, 30000); 
    });
  </script>
</body>
</html>
