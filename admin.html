<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Admin Kanban Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Rajdhani', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, #090d12 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    
    .glass-card {
      background: rgba(17, 24, 34, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    }
    
    .kanban-col-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .kanban-col-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .kanban-col-scroll::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }

    .ticket-card {
      background: #111822;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .ticket-card:hover {
      border-color: #22c55e;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .logo-glow {
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
    }

    select, textarea, input {
      background: rgba(9, 13, 18, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="p-3 sm:p-5 flex flex-col h-screen overflow-hidden items-center justify-center">

  <!-- 1. LOGIN SCREEN -->
  <div id="loginScreen" class="w-full max-w-md glass-card rounded-2xl p-6 sm:p-8 text-center space-y-6">
    <div class="w-16 h-16 rounded-full bg-black border-2 border-green-500 overflow-hidden logo-glow mx-auto flex items-center justify-center">
      <span class="font-brand text-green-400 font-bold text-sm">SKY</span>
    </div>
    <div>
      <h1 class="font-brand text-xl font-extrabold text-white tracking-wider">ADMIN PORTAL</h1>
      <p class="text-xs text-cyan-400 font-semibold mt-1">SKY TECHNOLOGIES KADAWATHA</p>
    </div>
    <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Admin Password:</label>
        <input type="password" id="adminPassword" required placeholder="Enter password (Sky1234)" class="w-full p-3 rounded-xl border text-sm">
      </div>
      <button type="submit" class="w-full font-brand bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-xl shadow-lg transition cursor-pointer text-sm">
        LOGIN TO DASHBOARD
      </button>
      <p id="loginError" class="text-red-400 text-xs text-center hidden font-semibold">Incorrect Password! Try again.</p>
    </form>
  </div>

  <!-- 2. DASHBOARD SCREEN (Hidden Initially) -->
  <div id="dashboardScreen" class="w-full h-full hidden flex-col overflow-hidden">
    <!-- Header Section -->
    <header class="glass-card border border-gray-800 rounded-xl p-3 sm:p-4 mb-3 sm:mb-4 flex justify-between items-center gap-3 flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-black border border-green-500 overflow-hidden logo-glow flex-shrink-0 flex items-center justify-center">
          <span class="font-brand text-green-400 font-bold text-xs">SKY</span>
        </div>
        <div>
          <h1 class="font-brand text-base sm:text-lg font-bold text-white tracking-wider flex items-center gap-2">
            SKY <span class="text-green-500">TECHNOLOGIES</span>
          </h1>
          <p class="text-[10px] sm:text-xs text-cyan-400 font-semibold tracking-wider">ADMIN HELPDESK KANBAN BOARD</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="fetchTickets()" class="font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 text-black text-xs font-bold px-3 py-2 sm:px-4 sm:py-2.5 rounded-lg shadow transition flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">REFRESH BOARD</span>
        </button>
        <button onclick="logoutAdmin()" class="bg-red-600/80 hover:bg-red-600 text-white font-bold px-3 py-2 sm:px-4 sm:py-2.5 rounded-lg text-xs transition cursor-pointer flex items-center gap-2 shadow">
          <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">LOGOUT</span>
        </button>
      </div>
    </header>

    <!-- Kanban Columns Container -->
    <main id="kanbanBoard" class="flex-1 flex gap-3 sm:gap-4 overflow-x-auto pb-2 items-start h-full">
      <div class="w-full text-center py-20 text-gray-500 font-brand">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-green-500 mb-3"></i>
        <p>LOADING HELPDESK TICKETS...</p>
      </div>
    </main>
  </div>

  <!-- 3. WHATSAPP EDIT MODAL -->
  <div id="waModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="glass-card w-full max-w-lg rounded-2xl p-6 space-y-4 border border-green-500/40 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="font-brand text-green-400 font-bold text-sm flex items-center gap-2">
          <i class="fa-brands fa-whatsapp text-lg"></i> Edit & Send WhatsApp Message
        </h3>
        <button onclick="closeWaModal()" class="text-gray-400 hover:text-white cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Customer Phone:</label>
          <input type="text" id="waPhone" class="w-full p-2.5 rounded-xl border text-sm" readonly>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Select Language:</label>
          <select id="waLang" onchange="updateWaMessageTemplate()" class="w-full p-2.5 rounded-xl border text-sm cursor-pointer">
            <option value="si">සිංහල (Sinhala)</option>
            <option value="en">English</option>
            <option value="ta">தமிழ் (Tamil)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Message Body (Editable):</label>
        <textarea id="waMessageText" rows="6" class="w-full p-2.5 rounded-xl border text-sm"></textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="closeWaModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl text-xs transition cursor-pointer">
          CANCEL
        </button>
        <button onclick="sendFinalWhatsApp()" class="flex-1 bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-xl text-xs transition cursor-pointer flex items-center justify-center gap-2 shadow">
          <i class="fa-brands fa-whatsapp text-base"></i> SEND TO WHATSAPP
        </button>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx2_Sz-XYIJNZcNpsyao52k1IMzCcRALuMiOUQdEfmQ6UpQCDTuHPilIGDw3E6gHMTjTw/exec';
    const ADMIN_PASS = 'Sky1234'; // නිවැරදි මුරපදය

    const columnsBase = [
      { id: "New Ticket", title: "New Ticket", color: "border-blue-500" },
      { id: "In Process", title: "In Process", color: "border-yellow-500" },
      { id: "On Hold", title: "On Hold", color: "border-purple-500" },
      { id: "Parts Pending", title: "Parts Pending", color: "border-orange-500" },
      { id: "Ready For Collect", title: "Ready For Collect", color: "border-emerald-500" },
      { id: "Delivered", title: "Delivered", color: "border-gray-600" }
    ];

    let globalTickets = [];
    let activeTicketData = null;

    // Login Logic
    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('adminPassword').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        document.getElementById('dashboardScreen').classList.add('flex');
        fetchTickets();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logoutAdmin() {
      document.getElementById('dashboardScreen').classList.remove('flex');
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('adminPassword').value = '';
    }

    function formatTicketNumber(val, rowIndex) {
      if (val && val.toString().trim() !== "") {
        let cleanVal = val.toString().trim();
        return cleanVal.startsWith('SKY-TICK-') ? cleanVal : `SKY-TICK-${cleanVal}`;
      }
      return `SKY-TICK-${1000 + (rowIndex - 1)}`;
    }

    function updateTicketStatus(rowIndex, newStatus) {
      const ticket = globalTickets.find(t => t.rowIndex === rowIndex);
      if (ticket) {
        ticket.status = newStatus;
      }

      renderBoard(globalTickets);

      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ 
          action: 'updateStatus', 
          rowIndex: rowIndex, 
          status: newStatus 
        })
      })
      .then(res => res.json())
      .then(data => console.log("Status updated successfully:", data))
      .catch(err => console.error("Error updating status:", err));
    }

    // Open WhatsApp Edit Modal
    function openWaModal(tk, selectId) {
      const selectedStatus = document.getElementById(selectId).value;
      activeTicketData = {
        ...tk,
        status: selectedStatus,
        ticketId: formatTicketNumber(tk.ticketNumber, tk.rowIndex)
      };

      document.getElementById('waPhone').value = tk.phoneNumber || '';
      document.getElementById('waLang').value = 'si';
      updateWaMessageTemplate();

      document.getElementById('waModal').classList.remove('hidden');
      document.getElementById('waModal').classList.add('flex');
    }

    function updateWaMessageTemplate() {
      if (!activeTicketData) return;
      const lang = document.getElementById('waLang').value;
      const name = activeTicketData.customerName || "Customer";
      const ticketId = activeTicketData.ticketId;
      const device = `${activeTicketData.deviceType || 'Device'} ${activeTicketData.deviceModel ? '- ' + activeTicketData.deviceModel : ''}`;
      const status = activeTicketData.status;

      let msg = '';
      if (lang === 'si') {
        msg = `🟢 *SKY TECHNOLOGIES - REPAIR UPDATE*\n\nHello ${name},\nYour device *${device}* (${ticketId}) status is now: *${status}*.\n---------------------------\nආයුබෝවන් ${name},\nඔබගේ උපකරණය *${device}* (${ticketId}) වත්මන් තත්ත්වය: *${status}* ලෙස යාවත්කාලීන කර ඇත.`;
      } else if (lang === 'ta') {
        msg = `🟢 *SKY TECHNOLOGIES - REPAIR UPDATE*\n\nHello ${name},\nYour device *${device}* (${ticketId}) status is now: *${status}*.\n---------------------------\nவணக்கம் ${name},\nஉங்கள் சாதனத்தின் நிலை *${status}* என புதுப்பிக்கப்பட்டுள்ளது.`;
      } else {
        msg = `🟢 *SKY TECHNOLOGIES - REPAIR UPDATE*\n\nHello ${name},\nYour repair ticket *${ticketId}* (${device}) status has been updated to: *${status}*.\n\nThank you for choosing Sky Technologies Kadawatha.`;
      }

      document.getElementById('waMessageText').value = msg;
    }

    function closeWaModal() {
      document.getElementById('waModal').classList.remove('flex');
      document.getElementById('waModal').classList.add('hidden');
    }

    function sendFinalWhatsApp() {
      if (!activeTicketData) return;
      const cleanPhone = (activeTicketData.phoneNumber || '').toString().replace(/[^0-9]/g, '');
      const msg = document.getElementById('waMessageText').value;
      const encodedMsg = encodeURIComponent(msg);
      window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedMsg}`, '_blank');
      closeWaModal();
    }

    function renderBoard(data) {
      const board = document.getElementById('kanbanBoard');

      if (!data || data.length === 0) {
        board.innerHTML = `<div class="text-center w-full py-10 text-gray-400">No Tickets Found.</div>`;
        return;
      }

      const grouped = {};
      columnsBase.forEach(col => grouped[col.id] = []);

      data.forEach(item => {
        const rawStatus = (item.status || "New Ticket").trim();
        const matchingCol = columnsBase.find(c => c.id.toLowerCase() === rawStatus.toLowerCase());
        const targetCol = matchingCol ? matchingCol.id : "New Ticket";
        grouped[targetCol].push(item);
      });

      let boardHtml = "";

      columnsBase.forEach(col => {
        const tickets = grouped[col.id] || [];
        
        boardHtml += `
          <div class="w-72 sm:w-80 flex-shrink-0 glass-card border border-gray-800 rounded-xl flex flex-col h-full max-h-full">
            <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-[#111822]/90 rounded-t-xl">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${col.color.replace('border-', 'bg-')}"></span>
                <h2 class="font-bold text-xs text-gray-200 tracking-wider">${col.title}</h2>
              </div>
              <span class="text-xs bg-gray-800 text-green-400 px-2 py-0.5 rounded-full font-bold font-mono border border-gray-700">${tickets.length}</span>
            </div>

            <div class="p-2 flex-1 overflow-y-auto space-y-2.5 kanban-col-scroll">
        `;

        if (tickets.length === 0) {
          boardHtml += `<div class="text-center py-8 text-gray-600 text-xs italic">No tickets in this column</div>`;
        } else {
          tickets.slice().reverse().forEach((tk) => {
            const ticketId = formatTicketNumber(tk.ticketNumber, tk.rowIndex);
            const customer = tk.customerName || "Unknown Customer";
            const phone = tk.phoneNumber || "";
            const device = `${tk.deviceType || 'Device'} ${tk.deviceModel ? '- ' + tk.deviceModel : ''}`;
            const selectId = `status-select-${tk.rowIndex}`;

            boardHtml += `
              <div class="ticket-card p-3 rounded-lg flex flex-col justify-between space-y-2 text-xs">
                <div>
                  <div class="flex justify-between items-start gap-2 mb-1">
                    <span class="font-brand font-extrabold text-green-400 text-xs sm:text-sm tracking-wide">${device}</span>
                  </div>
                  <div class="text-gray-400 text-[10px] sm:text-[11px] font-mono">${ticketId}</div>
                  <div class="text-white font-semibold mt-1 text-xs">${customer}</div>
                  <div class="text-gray-400 text-[11px] truncate mt-0.5"><i class="fa-solid fa-wrench text-gray-500 mr-1"></i> ${tk.faultDescription || '-'}</div>
                </div>

                <div class="pt-2 border-t border-gray-800/60 space-y-2">
                  <div>
                    <label class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider block mb-1">Select Process State:</label>
                    <select id="${selectId}" onchange="updateTicketStatus(${tk.rowIndex}, this.value)" class="w-full bg-black/80 border border-green-900/60 text-green-300 text-[11px] rounded p-1.5 focus:outline-none focus:border-green-500 font-sans cursor-pointer">
                      ${columnsBase.map(c => `
                        <option value="${c.id}" ${c.id === col.id ? 'selected' : ''}>
                          ${c.title}
                        </option>
                      `).join('')}
                    </select>
                  </div>

                  <div class="flex justify-between items-center gap-2 pt-1">
                    <span class="text-[10px] text-gray-400 font-mono"><i class="fa-solid fa-phone mr-1"></i>${phone}</span>

                    <button onclick='openWaModal(${JSON.stringify(tk)}, "${selectId}")' 
                            class="bg-green-600/20 hover:bg-green-500 text-green-400 hover:text-black border border-green-500/40 font-bold px-2.5 py-1.5 rounded transition text-[10px] flex items-center gap-1 cursor-pointer">
                      <i class="fa-brands fa-whatsapp text-xs"></i> SEND MSG
                    </button>
                  </div>
                </div>
              </div>
            `;
          });
        }

        boardHtml += `
            </div>
          </div>
        `;
      });

      board.innerHTML = boardHtml;
    }

    function fetchTickets() {
      const board = document.getElementById('kanbanBoard');

      board.innerHTML = `
        <div class="w-full text-center py-20 text-gray-500 font-brand">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-green-500 mb-3"></i>
          <p>FETCHING LATEST HELPDESK TICKETS...</p>
        </div>`;

      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          globalTickets = data;
          renderBoard(globalTickets);
        })
        .catch(err => {
          console.error(err);
          board.innerHTML = `<div class="text-center w-full py-10 text-red-400">Failed to load tickets. Please check Web App URL.</div>`;
        });
    }
  </script>
</body>
</html>
