<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Admin Helpdesk Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at top, #0b140d 0%, #05080a 50%, #020304 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .sky-glass-card {
      background: rgba(10, 18, 14, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
    }
    .logo-glow-ring { box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
    .neon-top-bar {
      background: linear-gradient(90deg, #22c55e, #06b6d4, #10b981);
      height: 4px;
    }
    .ticket-card {
      background: rgba(5, 12, 8, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.3);
      transition: all 0.2s ease-in-out;
    }
    .ticket-card:hover {
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
      transform: translateY(-2px);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #22c55e; }
  </style>
</head>
<body class="p-3 sm:p-6">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="max-w-md mx-auto mt-20 sky-glass-card rounded-2xl overflow-hidden p-8 text-center space-y-6">
    <div class="w-20 h-20 mx-auto rounded-full bg-black border-2 border-green-500 logo-glow-ring flex items-center justify-center overflow-hidden">
      <img src="logo.png" alt="SKY TECHNOLOGIES" class="w-full h-full object-cover" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\'/><text x=\'50%\' y=\'55%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%2322c55e\' font-size=\'20\' font-weight=\'bold\'>SKY</text></svg>'">
    </div>
    <div>
      <h2 class="font-brand text-xl font-bold text-white">ADMIN LOGIN</h2>
      <p class="text-xs text-gray-400 mt-1">SKY TECHNOLOGIES HELPDESK</p>
    </div>
    <div class="space-y-4">
      <input type="password" id="adminPassword" placeholder="Enter Admin Password" class="w-full bg-black/80 border border-green-500/40 rounded-xl px-4 py-3 text-sm text-center text-green-400 outline-none focus:border-green-400">
      <button onclick="checkPassword()" class="w-full font-brand bg-gradient-to-r from-green-500 to-emerald-600 text-black font-bold py-3 rounded-xl hover:from-green-400 hover:to-emerald-500 transition cursor-pointer text-sm">
        LOGIN
      </button>
      <p id="loginError" class="text-xs text-red-400 font-semibold hidden">Incorrect Password! Try again.</p>
    </div>
  </div>

  <!-- DASHBOARD MAIN CONTAINER -->
