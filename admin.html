<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Helpdesk Kanban Board</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Rajdhani', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
      background: #090d12;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    
    .kanban-col-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .kanban-col-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .kanban-col-scroll::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }

    .ticket-card {
      background: #111822;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .ticket-card:hover {
      border-color: #22c55e;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .logo-glow {
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
  </style>
</head>
<body class="p-3 sm:p-5 flex flex-col h-screen overflow-hidden">

  <!-- Header Section -->
  <header class="bg-[#111822] border border-gray-800 rounded-xl p-3 sm:p-4 mb-3 sm:mb-4 flex justify-between items-center gap-3 flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-black border border-green-500 overflow-hidden logo-glow flex-shrink-0 flex items-center justify-center">
        <img src="logo.png" alt="SKY Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="hidden font-brand text-green-400 font-bold text-xs">SKY</span>
      </div>
      <div>
        <h1 class="font-brand text-base sm:text-lg font-bold text-white tracking-wider flex items-center gap-2">
          SKY <span class="text-green-500">TECHNOLOGIES</span>
        </h1>
        <p class="text-[10px] sm:text-xs text-cyan-400 font-semibold tracking-wider">HELPDESK KANBAN BOARD</p>
      </div>
    </div>

    <button onclick="fetchTickets()" class="font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 text-black text-xs font-bold px-3 py-2 sm:px-4 sm:py-2.5 rounded-lg shadow transition flex items-center gap-2 cursor-pointer">
      <i class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">REFRESH BOARD</span>
    </button>
  </header>

  <!-- Kanban Columns Container -->
  <main id="kanbanBoard" class="flex-1 flex gap-3 sm:gap-4 overflow-x-auto pb-2 items-start h-full">
    <div class="w-full text-center py-20 text-gray-500 font-brand">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-green-500 mb-3"></i>
      <p>LOADING HELPDESK TICKETS...</p>
    </div>
  </main>

  <script>
    // නව Google Apps Script Web App URL එක (Template API සඳහා යාවත්කාලීන කරන ලදී)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz66WE5B_MHO1lF_mBXo8oHU_KDa5GWo_Jv5vYoYMMIIjfHu5zbDTbldnb-I_gbFQ9LOA/exec';

    const columnsBase = [
      { id: "New Ticket", title: "New Ticket", color: "border-blue-500" },
      { id: "In Process", title: "In Process", color: "border-yellow-500" },
      { id: "On Hold", title: "On Hold", color: "border-purple-500" },
      { id: "Parts Pending", title: "Parts Pending", color: "border-orange-500" },
      { id: "Ready For Collect", title: "Ready For Collect", color: "border-emerald-500" },
      { id: "Delivered", title: "Delivered", color: "border-gray-600" }
    ];

    let globalTickets = [];

    function formatTicketNumber(val, rowIndex) {
      if (val && val.toString().trim() !== "") {
        let cleanVal = val.toString().trim();
        return cleanVal.startsWith('SKY-TICK-') ? cleanVal : `SKY-TICK-${cleanVal}`;
      }
      return `SKY-TICK-${1000 + (rowIndex - 1)}`;
    }

    function updateTicketStatus(rowIndex, newStatus) {
      const ticket = globalTickets.find(t => t.rowIndex === rowIndex);
      if (ticket) {
        ticket.status = newStatus;
      }

      renderBoard(globalTickets);

      // Apps Script වෙත Status Update එක යැවීම
      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ 
          action: 'updateStatus', 
          rowIndex: rowIndex, 
          status: newStatus 
        })
      })
      .then(res => res.json())
      .then(data => console.log("Status updated successfully:", data))
      .catch(err => console.error("Error updating status:", err));
    }

    function sendWhatsAppUpdate(phone, name, ticketId, device, statusSelectId) {
      // Apps Script හරහා WhatsApp Template API එකට ඉල්ලීම යැවීම
      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ 
          action: 'sendWhatsApp', 
          phone: phone 
        })
      })
      .then(res => res.json())
      .then(data => {
        console.log("WhatsApp template message sent successfully:", data);
        alert("WhatsApp පණිවිඩය (Template) සාර්ථකව යවන ලදී!");
      })
      .catch(err => {
        console.error("Error sending WhatsApp:", err);
        alert("පණිවිඩය යැවීමේදී දෝෂයක් සිදු විය.");
      });
    }

    function renderBoard(data) {
      const board = document.getElementById('kanbanBoard');

      if (!data || data.length === 0) {
        board.innerHTML = `<div class="text-center w-full py-10 text-gray-400">No Tickets Found.</div>`;
        return;
      }

      const grouped = {};
      columnsBase.forEach(col => grouped[col.id] = []);

      data.forEach(item => {
        const rawStatus = (item.status || "New Ticket").trim();
        const matchingCol = columnsBase.find(c => c.id.toLowerCase() === rawStatus.toLowerCase());
        const targetCol = matchingCol ? matchingCol.id : "New Ticket";
        grouped[targetCol].push(item);
      });

      let boardHtml = "";

      columnsBase.forEach(col => {
        const tickets = grouped[col.id] || [];
        
        boardHtml += `
          <div class="w-72 sm:w-80 flex-shrink-0 bg-[#0d131d] border border-gray-800 rounded-xl flex flex-col h-full max-h-full">
            <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-[#111822] rounded-t-xl">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${col.color.replace('border-', 'bg-')}"></span>
                <h2 class="font-bold text-xs text-gray-200 tracking-wider">${col.title}</h2>
              </div>
              <span class="text-xs bg-gray-800 text-green-400 px-2 py-0.5 rounded-full font-bold font-mono border border-gray-700">${tickets.length}</span>
            </div>

            <div class="p-2 flex-1 overflow-y-auto space-y-2.5 kanban-col-scroll">
        `;

        if (tickets.length === 0) {
          boardHtml += `<div class="text-center py-8 text-gray-600 text-xs italic">No tickets in this column</div>`;
        } else {
          tickets.slice().reverse().forEach((tk) => {
            const ticketId = formatTicketNumber(tk.ticketNumber, tk.rowIndex);
            const customer = tk.customerName || "Unknown Customer";
            const phone = tk.phoneNumber || "";
            const device = `${tk.deviceType || 'Device'} ${tk.deviceModel ? '- ' + tk.deviceModel : ''}`;
            const selectId = `status-select-${tk.rowIndex}`;

            boardHtml += `
              <div class="ticket-card p-3 rounded-lg flex flex-col justify-between space-y-2 text-xs">
                <div>
                  <div class="flex justify-between items-start gap-2 mb-1">
                    <span class="font-brand font-extrabold text-green-400 text-xs sm:text-sm tracking-wide">${device}</span>
                  </div>
                  <div class="text-gray-400 text-[10px] sm:text-[11px] font-mono">${ticketId}</div>
                  <div class="text-white font-semibold mt-1 text-xs">${customer}</div>
                  <div class="text-gray-400 text-[11px] truncate mt-0.5"><i class="fa-solid fa-wrench text-gray-500 mr-1"></i> ${tk.faultDescription || '-'}</div>
                </div>

                <div class="pt-2 border-t border-gray-800/60 space-y-2">
                  <div>
                    <label class="text-[9px] text-cyan-400 font-bold uppercase tracking-wider block mb-1">Select Process State:</label>
                    <select id="${selectId}" onchange="updateTicketStatus(${tk.rowIndex}, this.value)" class="w-full bg-black/80 border border-green-900/60 text-green-300 text-[11px] rounded p-1 focus:outline-none focus:border-green-500 font-sans cursor-pointer">
                      ${columnsBase.map(c => `
                        <option value="${c.id}" ${c.id === col.id ? 'selected' : ''}>
                          ${c.title}
                        </option>
                      `).join('')}
                    </select>
                  </div>

                  <div class="flex justify-between items-center gap-2 pt-1">
                    <span class="text-[10px] text-gray-400 font-mono"><i class="fa-solid fa-phone mr-1"></i>${phone}</span>

                    <button onclick="sendWhatsAppUpdate('${phone}', '${customer.replace(/'/g, "\\'")}', '${ticketId}', '${tk.deviceType}', '${selectId}')" 
                            class="bg-green-600/20 hover:bg-green-500 text-green-400 hover:text-black border border-green-500/40 font-bold px-2 py-1 rounded transition text-[10px] flex items-center gap-1 cursor-pointer">
                      <i class="fa-brands fa-whatsapp text-xs"></i> SEND MSG
                    </button>
                  </div>
                </div>
              </div>
            `;
          });
        }

        boardHtml += `
            </div>
          </div>
        `;
      });

      board.innerHTML = boardHtml;
    }

    function fetchTickets() {
      const board = document.getElementById('kanbanBoard');

      board.innerHTML = `
        <div class="w-full text-center py-20 text-gray-500 font-brand">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-green-500 mb-3"></i>
          <p>FETCHING LATEST HELPDESK TICKETS...</p>
        </div>`;

      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          globalTickets = data;
          renderBoard(globalTickets);
        })
        .catch(err => {
          console.error(err);
          board.innerHTML = `<div class="text-center w-full py-10 text-red-400">Failed to load tickets. Please check Web App URL.</div>`;
        });
    }

    window.addEventListener('DOMContentLoaded', fetchTickets);
  </script>
</body>
</html>
