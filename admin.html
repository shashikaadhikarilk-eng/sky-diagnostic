<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKY TECHNOLOGIES - Admin Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at top, #0b140d 0%, #05080a 50%, #020304 100%);
      min-height: 100vh;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .sky-card {
      background: rgba(10, 18, 14, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 16px;
    }
    .sky-input {
      background: rgba(5, 12, 8, 0.9);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #38bdf8;
      border-radius: 10px;
    }
    .kanban-col {
      min-height: 480px;
      max-height: calc(100vh - 170px);
    }
    .ghost-card {
      opacity: 0.3;
      background: rgba(34, 197, 94, 0.15) !important;
      border: 2px dashed #22c55e !important;
    }
    .custom-scroll::-webkit-scrollbar { height: 8px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.4); border-radius: 10px; }
  </style>
</head>
<body class="p-3 sm:p-6 min-h-screen flex flex-col justify-between">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="hidden fixed bottom-5 left-5 bg-slate-900 border border-green-500 text-green-400 font-semibold px-4 py-3 rounded-xl z-50 shadow-2xl">
    <span id="toastMsg">Processing...</span>
  </div>

  <!-- LOGIN -->
  <div id="loginSection" class="w-full max-w-md sky-card p-6 text-center space-y-6 my-auto mx-auto">
    <h1 class="font-brand text-2xl font-extrabold text-white">SKY <span class="text-green-500">TECHNOLOGIES</span></h1>
    <form onsubmit="checkLogin(event)" class="space-y-4">
      <input type="password" id="adminPassword" required placeholder="Admin Password" class="w-full sky-input px-4 py-3 text-center text-lg">
      <button type="submit" class="w-full font-brand bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-xl transition">
        LOGIN TO KANBAN
      </button>
    </form>
  </div>

  <!-- KANBAN BOARD -->
  <div id="dashboardSection" class="hidden w-full space-y-4">
    <div class="flex justify-between items-center border-b border-green-900/50 pb-3">
      <h1 class="font-brand text-xl font-bold text-green-400">SKY TECHNOLOGIES ADMIN</h1>
      <div class="flex gap-2">
        <button onclick="loadJobs()" class="bg-green-600 text-black font-bold px-4 py-2 rounded-xl text-xs">🔄 Refresh</button>
        <button onclick="logout()" class="bg-red-950 text-red-300 border border-red-500/50 font-bold px-3 py-2 rounded-xl text-xs">🚪 Logout</button>
      </div>
    </div>

    <div id="kanbanBoard" class="flex gap-4 overflow-x-auto pb-6 custom-scroll items-start"></div>
  </div>

  <!-- WHATSAPP CUSTOMIZER MODAL -->
  <div id="waModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-green-500/50 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h3 class="font-brand text-green-400 font-bold text-sm">💬 Send Meta WhatsApp Notification</h3>
        <button onclick="closeWaModal()" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
      </div>
      
      <div class="bg-black/60 border border-green-900/50 rounded-xl p-3 text-xs space-y-1">
        <p><span class="text-gray-400">TICKET:</span> <strong id="modalJobInfo" class="text-emerald-400">SKY-TICK-XXXX</strong></p>
        <p><span class="text-gray-400">NEW STATUS:</span> <strong id="modalStatus" class="text-cyan-300 uppercase">In Process</strong></p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">EDIT MESSAGE TEXT BEFORE SENDING:</label>
        <textarea id="waMessageText" rows="8" class="w-full sky-input p-3 text-xs font-mono text-cyan-300 focus:outline-none custom-scroll"></textarea>
      </div>

      <div class="flex gap-2">
        <button onclick="sendDirectCustomWA()" class="flex-1 font-brand bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl text-xs transition">
          🚀 SEND DIRECT WHATSAPP MESSAGE NOW
        </button>
        <button onclick="closeWaModal()" class="bg-gray-800 text-gray-300 font-bold px-4 py-2.5 rounded-xl text-xs">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxedfvQOeRCy5in0BzfTISeZql1lgvKfeH4Bdej3K3Uetd6lTmlwZz-ipS2ZPQ8NvNycg/exec";
    const ADMIN_PASSWORD = "SKY@123";

    const STATUS_OPTIONS = [
      "New Ticket",
      "On Hold (Not Confirm Customer)",
      "Confirmed Customer",
      "In Process",
      "Parts Ordered",
      "Parts Pending",
      "Payment Pending",
      "Cannot Repair Products",
      "Ready for Pickup / Delivery",
      "Out for Delivery",
      "Delivered to Customer",
      "Completed / Closed"
    ];

    let activeJobData = {};

    window.onload = function() {
      if (sessionStorage.getItem("sky_admin_logged") === "true") showDashboard();
    };

    function checkLogin(e) {
      e.preventDefault();
      if (document.getElementById("adminPassword").value === ADMIN_PASSWORD) {
        sessionStorage.setItem("sky_admin_logged", "true");
        showDashboard();
      } else {
        alert("Invalid Password!");
      }
    }

    function showDashboard() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      loadJobs();
    }

    function logout() {
      sessionStorage.removeItem("sky_admin_logged");
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
    }

    function loadJobs() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = '<div class="text-cyan-400 font-bold animate-pulse text-center w-full py-10">Loading Board Data...</div>';

      fetch(`${GOOGLE_SCRIPT_URL}?action=getJobs`)
        .then(res => res.json())
        .then(data => {
          board.innerHTML = '';
          STATUS_OPTIONS.forEach(statusTitle => {
            const colId = `col-${statusTitle.replace(/[^a-zA-Z0-9]/g, '')}`;
            const filteredJobs = data ? data.filter(j => (j.status || "New Ticket") === statusTitle) : [];

            const colDiv = document.createElement('div');
            colDiv.className = 'sky-card w-80 min-w-[300px] flex flex-col p-3 rounded-2xl flex-shrink-0';
            colDiv.innerHTML = `
              <div class="flex justify-between items-center border-b border-green-900/50 pb-2 mb-3">
                <h3 class="font-brand text-xs font-bold text-green-400 uppercase truncate">${statusTitle}</h3>
                <span class="bg-green-950 text-green-400 border border-green-600/40 text-[10px] font-bold px-2 py-0.5 rounded-full">${filteredJobs.length}</span>
              </div>
              <div id="${colId}" data-status="${statusTitle}" class="kanban-col space-y-3 overflow-y-auto custom-scroll p-1 flex-1">
                ${filteredJobs.map(job => createCardHTML(job)).join('')}
              </div>
            `;
            board.appendChild(colDiv);

            new Sortable(document.getElementById(colId), {
              group: 'kanban-workflow',
              animation: 150,
              ghostClass: 'ghost-card',
              onEnd: function (evt) {
                const itemEl = evt.item;
                const newStatus = evt.to.getAttribute('data-status');
                const oldStatus = evt.from.getAttribute('data-status');

                if (newStatus !== oldStatus) {
                  openCustomizerModal(
                    itemEl.getAttribute('data-jobno'),
                    newStatus,
                    itemEl.getAttribute('data-phone'),
                    itemEl.getAttribute('data-device'),
                    itemEl.getAttribute('data-model'),
                    itemEl.getAttribute('data-name')
                  );
                }
              }
            });
          });
        });
    }

    function createCardHTML(job) {
      return `
        <div data-jobno="${job.jobNo}" data-phone="${job.phone}" data-device="${job.device}" data-model="${job.model}" data-name="${job.name}"
             class="bg-black/80 border border-gray-800 hover:border-green-500/60 p-3.5 rounded-xl cursor-grab transition space-y-2">
          <div class="flex justify-between items-center border-b border-gray-800 pb-1.5">
            <span class="font-brand text-cyan-400 font-bold text-xs">${job.jobNo}</span>
            <button onclick="openCustomizerModal('${job.jobNo}', '${job.status || 'New Ticket'}', '${job.phone}', '${job.device}', '${job.model}', '${job.name}')" 
                    class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-600/40 px-2 py-0.5 rounded">✍️ Edit Msg</button>
          </div>
          <div class="text-xs space-y-1">
            <p class="font-semibold text-white">${job.name}</p>
            <p class="text-emerald-400 font-medium">${job.device} <span class="text-gray-400 text-[10px]">(${job.model})</span></p>
            <p class="text-gray-400 text-[11px] line-clamp-2">${job.fault}</p>
          </div>
        </div>
      `;
    }

    function openCustomizerModal(jobNo, newStatus, phone, device, model, name) {
      activeJobData = { jobNo, newStatus, phone, device, model, name };

      document.getElementById('modalJobInfo').innerText = `${jobNo} (${device} ${model})`;
      document.getElementById('modalStatus').innerText = newStatus;

      let msgTemplate = `🛠️ *SKY TECHNOLOGIES - Repair Update*
*Ticket No:* ${jobNo}
*Device:* ${device} (${model})
*Status:* ${newStatus}

ENG: Your repair status has been updated to "${newStatus}".
SIN: ඔබගේ උපකරණයේ තත්වය "${newStatus}" ලෙස වෙනස් වී ඇත.`;

      document.getElementById('waMessageText').value = msgTemplate;
      document.getElementById('waModal').classList.remove('hidden');
    }

    function closeWaModal() {
      document.getElementById('waModal').classList.add('hidden');
    }

    function sendDirectCustomWA() {
      const customMsg = document.getElementById('waMessageText').value;
      closeWaModal();
      showToast(`🔄 Updating Status & Dispatching Meta WhatsApp...`);

      const formData = new FormData();
      formData.append('action', 'updateStatusAndSendWA');
      formData.append('jobNo', activeJobData.jobNo);
      formData.append('status', activeJobData.newStatus);
      formData.append('phone', activeJobData.phone);
      formData.append('message', customMsg);

      fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          showToast(`✅ Status Updated & WhatsApp Delivered!`);
        })
        .catch(err => showToast(`❌ Error sending message.`));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3500);
    }
  </script>
</body>
</html>
