<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at top, #0b140d 0%, #05080a 50%, #020304 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .sky-card {
      background: rgba(10, 18, 14, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
    }
    .sky-input {
      background: rgba(5, 12, 8, 0.8);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #38bdf8;
      border-radius: 8px;
    }
    .sky-input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
  </style>
</head>
<body class="p-4 sm:p-6 flex items-center justify-center min-h-screen">

  <!-- 1. LOGIN SCREEN -->
  <div id="loginSection" class="w-full max-w-md sky-card p-8 text-center space-y-6">
    <div class="space-y-2">
      <h1 class="font-brand text-2xl font-extrabold text-white">
        SKY <span class="text-green-500">TECHNOLOGIES</span>
      </h1>
      <p class="text-xs font-semibold text-cyan-400 tracking-wider uppercase">Admin Control Panel</p>
    </div>

    <form onsubmit="checkLogin(event)" class="space-y-4">
      <div class="text-left">
        <label class="block text-xs text-gray-400 mb-1">Enter Admin Password</label>
        <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full sky-input px-4 py-3 text-center text-lg tracking-widest">
      </div>
      
      <p id="errorMsg" class="text-red-400 text-xs hidden">❌ Invalid Password! Please try again.</p>

      <button type="submit" class="w-full font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-black font-bold py-3 rounded-xl shadow-lg transition cursor-pointer">
        LOGIN TO PANEL
      </button>
    </form>
  </div>

  <!-- 2. ADMIN DASHBOARD (Hidden by default) -->
  <div id="dashboardSection" class="hidden w-full max-w-6xl space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-green-900/50 pb-4">
      <div>
        <h1 class="font-brand text-2xl font-bold text-green-400">SKY TECHNOLOGIES</h1>
        <p class="text-xs text-cyan-400">Repair Jobs & Diagnostic Status Management</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadJobs()" class="bg-green-600 hover:bg-green-500 text-black font-bold px-4 py-2 rounded-lg text-sm transition">
          🔄 Refresh Jobs
        </button>
        <button onclick="logout()" class="bg-red-950/80 border border-red-500/50 hover:bg-red-900 text-red-300 font-bold px-3 py-2 rounded-lg text-sm transition">
          🚪 Logout
        </button>
      </div>
    </div>

    <!-- Jobs Table -->
    <div class="sky-card overflow-x-auto p-4">
      <table class="w-full text-left text-sm text-gray-300">
        <thead class="text-xs uppercase bg-green-950/60 text-green-400">
          <tr>
            <th class="p-3">Job No</th>
            <th class="p-3">Customer</th>
            <th class="p-3">Phone</th>
            <th class="p-3">Device</th>
            <th class="p-3">Fault Description</th>
            <th class="p-3">Current Status</th>
            <th class="p-3">Update Status</th>
          </tr>
        </thead>
        <tbody id="jobsTable">
          <tr>
            <td colspan="7" class="text-center p-6 text-gray-500">Loading jobs data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR9nl1y6NmuBkIMmZEUBjCKdhJHZDZrj1ArHufE91nG8gKP60WfG4jeYb77fhpQfXa2g/exec";
    
    // 🔑 මෙතැනට ඔබට අවශ්‍ය Admin Password එක යොදන්න:
    const ADMIN_PASSWORD = "SKY@123";

    // Auto check if already logged in during this session
    window.onload = function() {
      if (sessionStorage.getItem("sky_admin_logged") === "true") {
        showDashboard();
      }
    };

    function checkLogin(e) {
      e.preventDefault();
      const enteredPass = document.getElementById("adminPassword").value;
      const errorMsg = document.getElementById("errorMsg");

      if (enteredPass === ADMIN_PASSWORD) {
        sessionStorage.setItem("sky_admin_logged", "true");
        errorMsg.classList.add("hidden");
        showDashboard();
      } else {
        errorMsg.classList.remove("hidden");
        document.getElementById("adminPassword").value = "";
      }
    }

    function showDashboard() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      loadJobs();
    }

    function logout() {
      sessionStorage.removeItem("sky_admin_logged");
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("adminPassword").value = "";
    }

    function loadJobs() {
      const tbody = document.getElementById('jobsTable');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-6 text-cyan-400 animate-pulse">Fetching repair records from Google Sheets...</td></tr>';

      fetch(`${GOOGLE_SCRIPT_URL}?action=getJobs`)
        .then(res => res.json())
        .then(data => {
          tbody.innerHTML = '';
          
          if(!data || !data.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center p-6 text-gray-500">No repair jobs found.</td></tr>';
            return;
          }

          data.forEach(job => {
            tbody.innerHTML += `
              <tr class="border-b border-gray-800 hover:bg-black/40 transition">
                <td class="p-3 font-brand text-cyan-400 font-bold">${job.jobNo}</td>
                <td class="p-3 font-semibold text-white">${job.name}</td>
                <td class="p-3 text-gray-400">${job.phone}</td>
                <td class="p-3"><span class="text-emerald-400 font-medium">${job.device}</span> <br><span class="text-xs text-gray-500">${job.model}</span></td>
                <td class="p-3 max-w-xs text-xs text-gray-300 truncate" title="${job.fault}">${job.fault}</td>
                <td class="p-3">
                  <span class="px-2.5 py-1 bg-green-950/80 border border-green-500/40 text-green-400 text-xs font-semibold rounded-full">
                    ${job.status || 'Received'}
                  </span>
                </td>
                <td class="p-3">
                  <select onchange="updateStatus('${job.jobNo}', this.value, '${job.phone}')" class="bg-slate-900 border border-green-800 text-xs rounded-lg p-2 text-white hover:border-green-500 focus:outline-none">
                    <option value="">-- Change Status --</option>
                    <option value="Received">Received</option>
                    <option value="Diagnosing">Diagnosing</option>
                    <option value="Waiting for Parts">Waiting for Parts</option>
                    <option value="Repair Completed">Repair Completed</option>
                    <option value="Delivered">Delivered</option>
                  </select>
                </td>
              </tr>
            `;
          });
        })
        .catch(err => {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center p-6 text-red-400">Failed to load data. Please check connection or Web App deployment settings.</td></tr>';
        });
    }

    function updateStatus(jobNo, newStatus, phone) {
      if(!newStatus) return;
      
      const formData = new FormData();
      formData.append('action', 'updateStatus');
      formData.append('jobNo', jobNo);
      formData.append('status', newStatus);

      fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          if(data.result === 'success') {
            alert(`Job ${jobNo} status updated to: ${newStatus}`);
            
            // Open WhatsApp with Status Update Message
            const cleanPhone = phone.replace(/^0/, '94');
            const waMsg = `*SKY TECHNOLOGIES Status Update*%0A%0A*Job No:* ${jobNo}%0A*Status:* ${newStatus}`;
            window.open(`https://wa.me/${cleanPhone}?text=${waMsg}`, '_blank');
            
            loadJobs();
          } else {
            alert('Error updating status: ' + data.message);
          }
        });
    }
  </script>
</body>
</html>
