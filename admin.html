<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKY TECHNOLOGIES - Custom Meta Messaging Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at top, #0b140d 0%, #05080a 50%, #020304 100%);
      min-height: 100vh;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .sky-card {
      background: rgba(10, 18, 14, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
    }
    .sky-input {
      background: rgba(5, 12, 8, 0.9);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #38bdf8;
      border-radius: 10px;
    }
    .sky-input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
    .kanban-col {
      min-height: 480px;
      max-height: calc(100vh - 170px);
    }
    .ghost-card {
      opacity: 0.3;
      background: rgba(34, 197, 94, 0.15) !important;
      border: 2px dashed #22c55e !important;
    }
    .chosen-card {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
    }
    .drawer-slide {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .custom-scroll::-webkit-scrollbar { height: 8px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 10px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.4); border-radius: 10px; }
  </style>
</head>
<body class="p-3 sm:p-6 min-h-screen flex flex-col justify-between relative">

  <!-- NOTIFICATION TOAST -->
  <div id="toast" class="hidden fixed bottom-5 left-5 bg-slate-900 border border-green-500/80 text-green-400 font-semibold px-4 py-3 rounded-xl shadow-2xl z-50 transition-all flex items-center gap-2">
    <span id="toastMsg">Processing...</span>
  </div>

  <!-- 1. LOGIN SCREEN -->
  <div id="loginSection" class="w-full max-w-md sky-card p-6 sm:p-8 text-center space-y-6 my-auto mx-auto z-10">
    <div class="space-y-1">
      <h1 class="font-brand text-2xl font-extrabold text-white">
        SKY <span class="text-green-500">TECHNOLOGIES</span>
      </h1>
      <p class="text-[11px] font-semibold text-cyan-400 tracking-wider uppercase">Custom Message Admin Portal</p>
    </div>

    <form onsubmit="checkLogin(event)" class="space-y-4">
      <div class="text-left">
        <label class="block text-xs text-gray-400 mb-1">Enter Admin Password</label>
        <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full sky-input px-4 py-3 text-center text-lg tracking-widest">
      </div>
      <p id="errorMsg" class="text-red-400 text-xs hidden">❌ Invalid Password! Try again.</p>
      <button type="submit" class="w-full font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-black font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 cursor-pointer text-sm">
        LOGIN TO BOARD
      </button>
    </form>
  </div>

  <!-- 2. MAIN KANBAN DASHBOARD -->
  <div id="dashboardSection" class="hidden w-full space-y-4">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-green-900/50 pb-3">
      <div>
        <h1 class="font-brand text-xl sm:text-2xl font-bold text-green-400">SKY TECHNOLOGIES</h1>
        <p class="text-[11px] sm:text-xs text-cyan-400">Drag & Drop + Custom Message Auto Sync</p>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="loadJobs()" class="flex-1 sm:flex-initial bg-green-600 hover:bg-green-500 text-black font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition active:scale-95">
          🔄 Refresh
        </button>
        <button onclick="logout()" class="bg-red-950/80 border border-red-500/50 hover:bg-red-900 text-red-300 font-bold px-3 py-2.5 rounded-xl text-xs sm:text-sm transition active:scale-95">
          🚪 Logout
        </button>
      </div>
    </div>

    <!-- Kanban Board Scrollable Columns -->
    <div id="kanbanBoard" class="flex gap-4 overflow-x-auto pb-6 pt-2 custom-scroll items-start"></div>
  </div>

  <!-- 3. SLIDE-OVER MESSAGE CUSTOMIZER DRAWER -->
  <div id="drawerOverlay" onclick="closeDrawer()" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-40 transition-opacity"></div>
  
  <div id="chatDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[480px] bg-slate-950 border-l border-green-500/40 z-50 p-5 shadow-2xl flex flex-col justify-between translate-x-full drawer-slide">
    
    <div class="space-y-4">
      <!-- Header -->
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">✍️</span>
          <div>
            <h3 class="font-brand text-green-400 font-bold text-sm" id="drawerJobNo">SKY-TICK-XXXX</h3>
            <p class="text-[10px] text-cyan-400 uppercase tracking-wider" id="drawerCustomerName">Customize Notification Message</p>
          </div>
        </div>
        <button onclick="closeDrawer()" class="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-lg flex items-center justify-center transition">
          &times;
        </button>
      </div>

      <!-- Target Status & Recipient Info -->
      <div class="bg-black/60 border border-green-900/50 rounded-xl p-3 text-xs space-y-1">
        <div class="flex justify-between">
          <span class="text-gray-400">NEW STATUS:</span>
          <strong id="drawerStatus" class="text-emerald-400 uppercase font-brand">In Process</strong>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">RECIPIENT:</span>
          <strong id="drawerPhone" class="text-cyan-300 font-mono">+94 7X XXX XXXX</strong>
        </div>
      </div>

      <!-- Editable Message Text Area -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-300 flex justify-between">
          <span>EDIT MESSAGE TEXT:</span>
          <span class="text-[10px] text-gray-400">(Type anything custom here)</span>
        </label>
        <textarea id="customMessageArea" rows="11" class="w-full sky-input p-3 text-xs font-mono text-cyan-300 focus:outline-none leading-relaxed custom-scroll"></textarea>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-2 pt-3 border-t border-gray-800">
      <button onclick="confirmAndSendCustomWA()" class="w-full font-brand bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-black font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-xs tracking-wider flex items-center justify-center gap-2">
        🚀 SEND THIS CUSTOM MESSAGE NOW
      </button>
      <button onclick="closeDrawer()" class="w-full bg-slate-900 hover:bg-slate-800 text-gray-400 font-bold py-2 rounded-xl text-xs transition">
        Cancel & Close
      </button>
    </div>

  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxj6RlYPQCccascvaUc8MRAhLJ2_oHPsyWCgoKgJh95iYLRL9LxYUXBC9pU1S8-wZbliw/exec";
    const ADMIN_PASSWORD = "SKY@123";

    const STATUS_OPTIONS = [
      "New Ticket",
      "On Hold (Not Confirm Customer)",
      "Confirmed Customer",
      "In Process",
      "Parts Ordered",
      "Parts Pending",
      "Payment Pending",
      "Cannot Repair Products",
      "Ready for Pickup / Delivery",
      "Out for Delivery",
      "Delivered to Customer",
      "Completed / Closed"
    ];

    const TRILINGUAL_MESSAGES = {
      "New Ticket": 
`🛠️ *SKY TECHNOLOGIES - Status Update*
*Ticket No:* {JOB_NO}
*Device:* {DEVICE} ({MODEL})

ENG: Your repair ticket has been created successfully. We will start diagnosis soon.
SIN: ඔබගේ උපකරණය භාර ගන්නා ලදී. පරික්ෂා කිරීම ළඟදීම ආරම්භ කෙරේ.
TAM: உங்கள் சாதனம் பெறப்பட்டது. விரைவில் பரிசோதனை தொடங்கப்படும்.`,

      "In Process": 
`🛠️ *SKY TECHNOLOGIES - Status Update*
*Ticket No:* {JOB_NO}
*Device:* {DEVICE} ({MODEL})

ENG: Your device is currently undergoing diagnostic / repair process.
SIN: ඔබගේ උපකරණයේ අලුත්වැඩියා කටයුතු මේ වන විට සිදුවෙමින් පවතී.
TAM: உங்கள் சாதனம் தற்போது பழுதுபார்க்கப்பட்டு வருகிறது.`,

      "Ready for Pickup / Delivery": 
`🛠️ *SKY TECHNOLOGIES - Status Update*
*Ticket No:* {JOB_NO}
*Device:* {DEVICE} ({MODEL})

ENG: Your repair is COMPLETED! Your device is ready for pickup/delivery.
SIN: ඔබගේ උපකරණයේ අලුත්වැඩියාව සාර්ථකව නිම කර ඇත. දැන් පැමිණ ලබාගත හැක.
TAM: உங்கள் பழுதுபார்ப்பு முடிந்தது! சாதனத்தை இப்போது பெற்றுக்கொள்ளலாம்.`
    };

    let activeJobData = {};

    window.onload = function() {
      if (sessionStorage.getItem("sky_admin_logged") === "true") {
        showDashboard();
      }
    };

    function checkLogin(e) {
      e.preventDefault();
      if (document.getElementById("adminPassword").value === ADMIN_PASSWORD) {
        sessionStorage.setItem("sky_admin_logged", "true");
        showDashboard();
      } else {
        document.getElementById("errorMsg").classList.remove("hidden");
        document.getElementById("adminPassword").value = "";
      }
    }

    function showDashboard() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      loadJobs();
    }

    function logout() {
      sessionStorage.removeItem("sky_admin_logged");
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
    }

    function loadJobs() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = '<div class="text-cyan-400 font-bold animate-pulse text-center w-full py-10">Loading Kanban Board...</div>';

      fetch(`${GOOGLE_SCRIPT_URL}?action=getJobs`)
        .then(res => res.json())
        .then(data => {
          board.innerHTML = '';
          const fragment = document.createDocumentFragment();

          STATUS_OPTIONS.forEach(statusTitle => {
            const colId = `col-${statusTitle.replace(/[^a-zA-Z0-9]/g, '')}`;
            const filteredJobs = data ? data.filter(j => (j.status || "New Ticket") === statusTitle) : [];

            const colDiv = document.createElement('div');
            colDiv.className = 'sky-card w-80 min-w-[300px] flex flex-col p-3 rounded-2xl flex-shrink-0';
            colDiv.innerHTML = `
              <div class="flex justify-between items-center border-b border-green-900/50 pb-2 mb-3 px-1">
                <h3 class="font-brand text-xs font-bold text-green-400 uppercase tracking-wide truncate max-w-[200px]" title="${statusTitle}">
                  ${statusTitle}
                </h3>
                <span class="bg-green-950 text-green-400 border border-green-600/40 text-[10px] font-bold px-2 py-0.5 rounded-full">
                  ${filteredJobs.length}
                </span>
              </div>
              <div id="${colId}" data-status="${statusTitle}" class="kanban-col space-y-3 overflow-y-auto custom-scroll p-1 flex-1">
                ${filteredJobs.map(job => createCardHTML(job)).join('')}
              </div>
            `;
            fragment.appendChild(colDiv);
          });

          board.appendChild(fragment);

          STATUS_OPTIONS.forEach(statusTitle => {
            const colId = `col-${statusTitle.replace(/[^a-zA-Z0-9]/g, '')}`;
            const el = document.getElementById(colId);

            new Sortable(el, {
              group: 'kanban-workflow',
              animation: 150,
              ghostClass: 'ghost-card',
              chosenClass: 'chosen-card',
              onEnd: function (evt) {
                const itemEl = evt.item;
                const newStatus = evt.to.getAttribute('data-status');
                const oldStatus = evt.from.getAttribute('data-status');

                if (newStatus !== oldStatus) {
                  const jobNo = itemEl.getAttribute('data-jobno');
                  const phone = itemEl.getAttribute('data-phone');
                  const device = itemEl.getAttribute('data-device');
                  const model = itemEl.getAttribute('data-model');
                  const name = itemEl.getAttribute('data-name');

                  openCustomizerDrawer(jobNo, newStatus, phone, device, model, name);
                }
              }
            });
          });
        })
        .catch(err => {
          board.innerHTML = '<div class="text-red-400 text-center w-full py-10">Failed to load data.</div>';
        });
    }

    function createCardHTML(job) {
      return `
        <div data-jobno="${job.jobNo}" data-phone="${job.phone}" data-device="${job.device}" data-model="${job.model}" data-name="${job.name}"
             class="bg-black/80 border border-gray-800 hover:border-green-500/60 p-3.5 rounded-xl cursor-grab active:cursor-grabbing transition shadow-md hover:shadow-green-900/20 space-y-2">
          
          <div class="flex justify-between items-center border-b border-gray-800/80 pb-1.5">
            <span class="font-brand text-cyan-400 font-bold text-xs">${job.jobNo}</span>
            <button onclick="openCustomizerDrawer('${job.jobNo}', '${job.status || 'New Ticket'}', '${job.phone}', '${job.device}', '${job.model}', '${job.name}')" 
                    class="text-[10px] bg-emerald-950 hover:bg-emerald-800 text-emerald-400 border border-emerald-600/40 px-2 py-0.5 rounded transition active:scale-95">
              ✍️ Customize
            </button>
          </div>

          <div class="text-xs space-y-1">
            <p class="font-semibold text-white">${job.name}</p>
            <p class="text-emerald-400 font-medium">${job.device} <span class="text-gray-400 text-[10px]">(${job.model})</span></p>
            <p class="text-gray-400 text-[11px] line-clamp-2" title="${job.fault}">${job.fault}</p>
          </div>
        </div>
      `;
    }

    function openCustomizerDrawer(jobNo, newStatus, phone, device, model, name) {
      activeJobData = { jobNo, newStatus, phone, device, model, name };

      document.getElementById('drawerJobNo').innerText = jobNo;
      document.getElementById('drawerCustomerName').innerText = `${name} - ${device}`;
      document.getElementById('drawerStatus').innerText = newStatus;
      document.getElementById('drawerPhone').innerText = phone;

      let template = TRILINGUAL_MESSAGES[newStatus] || 
`🛠️ *SKY TECHNOLOGIES - Status Update*
*Ticket No:* ${jobNo}
*Device:* ${device} (${model})
*Status:* ${newStatus}`;

      let formattedMsg = template
        .replace(/{JOB_NO}/g, jobNo)
        .replace(/{DEVICE}/g, device)
        .replace(/{MODEL}/g, model);

      document.getElementById('customMessageArea').value = formattedMsg;

      document.getElementById('drawerOverlay').classList.remove('hidden');
      document.getElementById('chatDrawer').classList.remove('translate-x-full');
    }

    function closeDrawer() {
      document.getElementById('chatDrawer').classList.add('translate-x-full');
      document.getElementById('drawerOverlay').classList.add('hidden');
    }

    function confirmAndSendCustomWA() {
      const customMsg = document.getElementById('customMessageArea').value;
      if (!customMsg.trim()) {
        alert("Please enter a message!");
        return;
      }

      closeDrawer();
      showToast(`🔄 Syncing Sheet & Sending Custom WhatsApp...`);

      const formData = new FormData();
      formData.append('action', 'updateStatusAndSendWA');
      formData.append('jobNo', activeJobData.jobNo);
      formData.append('status', activeJobData.newStatus);
      formData.append('phone', activeJobData.phone);
      formData.append('message', customMsg);

      fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          showToast(`✅ Status Updated & Custom WhatsApp Sent!`);
        })
        .catch(err => {
          showToast(`❌ Error sending message.`);
        });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3500);
    }
  </script>
</body>
</html>
