<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Helpdesk Kanban Board</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Rajdhani', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
      background: #090d12;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    
    .kanban-col-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .kanban-col-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .kanban-col-scroll::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }

    .ticket-card {
      background: #111822;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .ticket-card:hover {
      border-color: #22c55e;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="p-3 sm:p-5 flex flex-col h-screen overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="bg-[#111822] border border-gray-800 rounded-xl p-3 sm:p-4 mb-3 sm:mb-4 flex flex-col md:flex-row justify-between items-center gap-3 flex-shrink-0">
    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-green-500/20 border border-green-500 flex items-center justify-center font-bold text-green-400 font-brand text-sm sm:text-base">
          ST
        </div>
        <div>
          <h1 class="font-brand text-base sm:text-lg font-bold text-white tracking-wider flex items-center gap-2">
            SKY <span class="text-green-500">TECHNOLOGIES</span>
          </h1>
          <p id="subTitle" class="text-[10px] sm:text-xs text-cyan-400 font-semibold tracking-wider">HELPDESK KANBAN BOARD</p>
        </div>
      </div>

      <!-- Refresh Button Mobile -->
      <button onclick="fetchTickets()" class="md:hidden font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 text-black text-xs font-bold p-2 rounded-lg shadow">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>

    <!-- Right Controls: Language Switcher & Refresh -->
    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
      <!-- Language Switcher Buttons -->
      <div class="flex bg-[#0d131d] p-1 rounded-lg border border-gray-800 text-xs font-bold">
        <button id="lang-en" onclick="setLanguage('en')" class="px-2.5 py-1 rounded text-green-400 bg-gray-800 transition">EN</button>
        <button id="lang-si" onclick="setLanguage('si')" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">සිං</button>
        <button id="lang-ta" onclick="setLanguage('ta')" class="px-2.5 py-1 rounded text-gray-400 hover:text-white transition">தமி</button>
      </div>

      <!-- Refresh Button Desktop -->
      <button onclick="fetchTickets()" class="hidden md:flex font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-black text-xs font-bold px-4 py-2.5 rounded-lg shadow transition items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-rotate-right"></i> <span id="btnRefresh">REFRESH BOARD</span>
      </button>
    </div>
  </header>

  <!-- Kanban Board Columns Container -->
  <main id="kanbanBoard" class="flex-1 flex gap-3 sm:gap-4 overflow-x-auto pb-2 items-start h-full">
    <div class="w-full text-center py-20 text-gray-500 font-brand">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-green-500 mb-3"></i>
      <p id="loadingText">LOADING HELPDESK TICKETS...</p>
    </div>
  </main>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwRSSSQZCjOTuZwHltkFUOw1qA7Ib74zDBKr_RmcVPbusBxu0Hekf6cC6NT9E1-Xz-DOg/exec';

    let currentLang = 'en';
    let globalTicketsData = [];

    // Language Translations
    const translations = {
      en: {
        subTitle: "HELPDESK KANBAN BOARD",
        btnRefresh: "REFRESH BOARD",
        loadingText: "LOADING HELPDESK TICKETS...",
        noTickets: "No Tickets Found.",
        noCardInCol: "No tickets in this column",
        sendMsgBtn: "SEND MSG",
        columns: {
          "New Ticket": "New Ticket",
          "In Process": "In Process",
          "On Hold": "On Hold (Pending Confirm)",
          "Parts Pending": "Parts Pending",
          "Ready For Collect": "Ready For Collect",
          "Delivered": "Delivered"
        }
      },
      si: {
        subTitle: "සේවා පුවරුව (HELPDESK)",
        btnRefresh: "යාවත්කාලීන කරන්න",
        loadingText: "දත්ත ලබා ගනිමින් පවතී...",
        noTickets: "ටිකට්පත් කිසිවක් හමු නොවීය.",
        noCardInCol: "මෙම තීරුවේ ටිකට්පත් නොමැත",
        sendMsgBtn: "පණිවිඩය යවන්න",
        columns: {
          "New Ticket": "නව ටිකට්පත",
          "In Process": "ක්‍රියාත්මක වෙමින්",
          "On Hold": "රඳවා තබා ඇත",
          "Parts Pending": "කොටස් ලැබෙනතුරු",
          "Ready For Collect": "ලබා ගැනීමට සූදානම්",
          "Delivered": "භාර දෙන ලදී"
        }
      },
      ta: {
        subTitle: "உதவி மேசை பலகை",
        btnRefresh: "புதுப்பிக்கவும்",
        loadingText: "தரவு ஏற்றப்படுகிறது...",
        noTickets: "டிக்கெட்டுகள் எதுவும் இல்லை.",
        noCardInCol: "இந்த பத்தியில் டிக்கெட்டுகள் இல்லை",
        sendMsgBtn: "செய்தி அனுப்பு",
        columns: {
          "New Ticket": "புதிய டிக்கெட்",
          "In Process": "செயல்பாட்டில் உள்ளது",
          "On Hold": "நிறுத்தி வைக்கப்பட்டுள்ளது",
          "Parts Pending": "உதிரிபாகங்கள் வர வேண்டும்",
          "Ready For Collect": "பெற தயாராக உள்ளது",
          "Delivered": "ஒப்படைக்கப்பட்டது"
        }
      }
    };

    const columnsBase = [
      { id: "New Ticket", color: "border-blue-500" },
      { id: "In Process", color: "border-yellow-500" },
      { id: "On Hold", color: "border-purple-500" },
      { id: "Parts Pending", color: "border-orange-500" },
      { id: "Ready For Collect", color: "border-emerald-500" },
      { id: "Delivered", color: "border-gray-600" }
    ];

    function setLanguage(lang) {
      currentLang = lang;
      
      // Update Language Switcher UI
      ['en', 'si', 'ta'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if(l === lang) {
          btn.className = "px-2.5 py-1 rounded text-green-400 bg-gray-800 transition";
        } else {
          btn.className = "px-2.5 py-1 rounded text-gray-400 hover:text-white transition";
        }
      });

      // Update UI Text
      const t = translations[lang];
      document.getElementById('subTitle').innerText = t.subTitle;
      document.getElementById('btnRefresh').innerText = t.btnRefresh;

      // Re-render Board
      renderBoard();
    }

    function formatTicketNumber(val, rowIndex) {
      if (val && val.toString().trim() !== "") {
        let cleanVal = val.toString().trim();
        return cleanVal.startsWith('SKY-TICK-') ? cleanVal : `SKY-TICK-${cleanVal}`;
      }
      return `SKY-TICK-${1000 + (rowIndex - 1)}`;
    }

    // Dynamic WhatsApp Message by Language and Status
    function sendWhatsAppUpdate(phone, name, ticketId, device, status) {
      let message = "";
      
      if (currentLang === 'si') {
        switch(status) {
          case "In Process":
            message = `🛠 *SKY TECHNOLOGIES - අලුත්වැඩියා යාවත්කාලීන කිරීම*\n\nආයුබෝවන් ${name},\nඔබගේ *${device}* උපකරණය (ටිකට් අංකය: *${ticketId}*) පරීක්ෂා කිරීම/අලුත්වැඩියා කිරීම ආරම්භ කර ඇත (*IN PROCESS*).\nඅලුත්වැඩියාව නිම වූ පසු දැනුම් දෙන්නෙමු. ස්තූතියි!`;
            break;
          case "On Hold":
            message = `⚠️ *SKY TECHNOLOGIES - දැනුම්දීමයි*\n\nආයුබෝවන් ${name},\nඔබගේ *${device}* අලුත්වැඩියාව (අංක: *${ticketId}*) තාවකාලිකව රඳවා තබා ඇත (*ON HOLD*). කරුණාකර අලුත්වැඩියා මුදල/තහවුරු කිරීම සඳහා අප හා සම්බන්ධ වන්න.`;
            break;
          case "Parts Pending":
            message = `📦 *SKY TECHNOLOGIES - අමතර කොටස් දැනුම්දීම*\n\nආයුබෝවන් ${name},\nඔබගේ *${device}* (*${ticketId}*) සඳහා අවශ්‍ය අමතර කොටස් ලැබෙන තෙක් රැඳී සිටී. කොටස් ලැබුණු වහාම දැනුම් දෙන්නෙමු.`;
            break;
          case "Ready For Collect":
            message = `✅ *SKY TECHNOLOGIES - භාරගැනීමට සූදානම්*\n\nආයුබෝවන් ${name},\nසුබ ආරංචියක්! ඔබගේ *${device}* (*${ticketId}*) අලුත්වැඩියා කර අවසන් (*READY FOR PICKUP*).\n\n📍 පැමිණ භාරගන්න: Sky Technologies Kadawatha.`;
            break;
          default:
            message = `ℹ️ *SKY TECHNOLOGIES - යාවත්කාලීන කිරීම*\n\nආයුබෝවන් ${name},\nඔබගේ ටිකට් අංක *${ticketId}* (${device}) හි වත්මන් තත්ත්වය: *${status}*.`;
        }
      } else if (currentLang === 'ta') {
        switch(status) {
          case "In Process":
            message = `🛠 *SKY TECHNOLOGIES - பழுதுபார்ப்பு புதுப்பிப்பு*\n\nவணக்கம் ${name},\nஉங்கள் சாதனம் *${device}* (டிக்கெட் எண்: *${ticketId}*) பழுதுபார்க்கத் தொடங்கப்பட்டுள்ளது (*IN PROCESS*). நன்றி!`;
            break;
          case "Ready For Collect":
            message = `✅ *SKY TECHNOLOGIES - பெற தயார்*\n\nவணக்கம் ${name},\nஉங்கள் சாதனம் *${device}* (*${ticketId}*) பழுதுபார்க்கப்பட்டு தயார் நிலையில் உள்ளது (*READY FOR PICKUP*).\n\n📍 Sky Technologies Kadawatha.`;
            break;
          default:
            message = `ℹ️ *SKY TECHNOLOGIES - புதுப்பிப்பு*\n\nவணக்கம் ${name},\nடிக்கெட் *${ticketId}* (${device}): தற்போதைய நிலை *${status}*.`;
        }
      } else {
        // English Default
        switch(status) {
          case "In Process":
            message = `🛠 *SKY TECHNOLOGIES - Repair Update*\n\nHello ${name},\nYour device *${device}* (Ticket ID: *${ticketId}*) is now *IN PROCESS* for diagnostics/repairs. Thank you!`;
            break;
          case "On Hold":
            message = `⚠️ *SKY TECHNOLOGIES - Action Required*\n\nHello ${name},\nYour repair ticket *${ticketId}* (${device}) is placed *ON HOLD*. Please contact us regarding repair confirmation.`;
            break;
          case "Parts Pending":
            message = `📦 *SKY TECHNOLOGIES - Parts Update*\n\nHello ${name},\nYour device *${device}* (*${ticketId}*) is waiting for required spare parts.`;
            break;
          case "Ready For Collect":
            message = `✅ *SKY TECHNOLOGIES - Ready For Pickup*\n\nHello ${name},\nGood news! Your device *${device}* (*${ticketId}*) repair is *COMPLETED & READY FOR PICKUP*.\n\n📍 Visit Sky Technologies Kadawatha.`;
            break;
          default:
            message = `ℹ️️ *SKY TECHNOLOGIES - Ticket Update*\n\nHello ${name},\nTicket *${ticketId}* (${device}): Current Status is *${status}*.`;
        }
      }

      const cleanPhone = phone.toString().replace(/[^0-9]/g, '');
      const encodedMsg = encodeURIComponent(message);
      window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedMsg}`, '_blank');
    }

    function renderBoard() {
      const board = document.getElementById('kanbanBoard');
      const t = translations[currentLang];

      if (!globalTicketsData || globalTicketsData.length === 0) {
        board.innerHTML = `<div class="text-center w-full py-10 text-gray-400">${t.noTickets}</div>`;
        return;
      }

      const grouped = {};
      columnsBase.forEach(col => grouped[col.id] = []);

      globalTicketsData.forEach(item => {
        const rawStatus = (item.status || "New Ticket").trim();
        const matchingCol = columnsBase.find(c => c.id.toLowerCase() === rawStatus.toLowerCase());
        const targetCol = matchingCol ? matchingCol.id : "New Ticket";
        grouped[targetCol].push(item);
      });

      let boardHtml = "";

      columnsBase.forEach(col => {
        const tickets = grouped[col.id] || [];
        const colTitle = t.columns[col.id] || col.id;
        
        boardHtml += `
          <div class="w-72 sm:w-80 flex-shrink-0 bg-[#0d131d] border border-gray-800 rounded-xl flex flex-col h-full max-h-full">
            <!-- Column Header -->
            <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-[#111822] rounded-t-xl">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${col.color.replace('border-', 'bg-')}"></span>
                <h2 class="font-bold text-xs text-gray-200 tracking-wider">${colTitle}</h2>
              </div>
              <span class="text-xs bg-gray-800 text-green-400 px-2 py-0.5 rounded-full font-bold font-mono border border-gray-700">${tickets.length}</span>
            </div>

            <!-- Scroll Area -->
            <div class="p-2 flex-1 overflow-y-auto space-y-2.5 kanban-col-scroll">
        `;

        if (tickets.length === 0) {
          boardHtml += `<div class="text-center py-8 text-gray-600 text-xs italic">${t.noCardInCol}</div>`;
        } else {
          tickets.reverse().forEach(tk => {
            const ticketId = formatTicketNumber(tk.ticketNumber, tk.rowIndex);
            const customer = tk.customerName || "Unknown Customer";
            const phone = tk.phoneNumber || "";
            const device = `${tk.deviceType || 'Device'} ${tk.deviceModel ? '- ' + tk.deviceModel : ''}`;

            boardHtml += `
              <div class="ticket-card p-3 rounded-lg flex flex-col justify-between space-y-2 text-xs">
                <div>
                  <div class="flex justify-between items-start gap-2 mb-1">
                    <span class="font-brand font-extrabold text-green-400 text-xs sm:text-sm tracking-wide">${device}</span>
                  </div>
                  <div class="text-gray-400 text-[10px] sm:text-[11px] font-mono">${ticketId}</div>
                  <div class="text-white font-semibold mt-1 text-xs">${customer}</div>
                  <div class="text-gray-400 text-[11px] truncate mt-0.5"><i class="fa-solid fa-wrench text-gray-500 mr-1"></i> ${tk.faultDescription || '-'}</div>
                </div>

                <!-- Card Actions -->
                <div class="pt-2 border-t border-gray-800/60 flex justify-between items-center gap-2">
                  <span class="text-[10px] text-gray-400 font-mono"><i class="fa-solid fa-phone mr-1"></i>${phone}</span>

                  <button onclick="sendWhatsAppUpdate('${phone}', '${customer.replace(/'/g, "\\'")}', '${ticketId}', '${tk.deviceType}', '${col.id}')" 
                          class="bg-green-600/20 hover:bg-green-500 text-green-400 hover:text-black border border-green-500/40 font-bold px-2 py-1 rounded transition text-[10px] flex items-center gap-1 cursor-pointer">
                    <i class="fa-brands fa-whatsapp text-xs"></i> ${t.sendMsgBtn}
                  </button>
                </div>
              </div>
            `;
          });
        }

        boardHtml += `
            </div>
          </div>
        `;
      });

      board.innerHTML = boardHtml;
    }

    function fetchTickets() {
      const board = document.getElementById('kanbanBoard');
      const t = translations[currentLang];

      board.innerHTML = `
        <div class="w-full text-center py-20 text-gray-500 font-brand">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-green-500 mb-3"></i>
          <p>${t.loadingText}</p>
        </div>`;

      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          globalTicketsData = data;
          renderBoard();
        })
        .catch(err => {
          console.error(err);
          board.innerHTML = `<div class="text-center w-full py-10 text-red-400">Failed to load tickets.</div>`;
        });
    }

    window.addEventListener('DOMContentLoaded', fetchTickets);
  </script>
</body>
</html>
