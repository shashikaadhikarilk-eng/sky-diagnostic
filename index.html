<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Book Repair Service</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: 'Rajdhani', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
      background: #090d12;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    
    .glass-card {
      background: #111822;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .logo-glow {
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
    }

    input, select, textarea {
      background: #090d12 !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      color: #ffffff !important;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #22c55e !important;
      outline: none !important;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3) !important;
    }
  </style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center justify-center min-h-screen">

  <div class="w-full max-w-xl glass-card rounded-2xl p-5 sm:p-8 my-4">
    
    <!-- Header / Brand Section -->
    <div class="text-center mb-6 border-b border-gray-800 pb-5">
      <div class="w-16 h-16 rounded-full bg-black border-2 border-green-500 overflow-hidden logo-glow mx-auto mb-3 flex items-center justify-center">
        <img src="logo.png" alt="SKY Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="hidden font-brand text-green-400 font-bold text-sm">SKY</span>
      </div>
      <h1 class="font-brand text-xl sm:text-2xl font-extrabold text-white tracking-wider">
        SKY <span class="text-green-500">TECHNOLOGIES</span>
      </h1>
      <p class="text-xs sm:text-sm text-cyan-400 font-semibold tracking-wider mt-1">COMPUTER & MOTHERBOARD REPAIR HELPDESK</p>
      <p class="text-gray-400 text-xs mt-2">කඩවත | Kadawatha - Monday Service Only (Appointment Required)</p>
    </div>

    <!-- Booking Form -->
    <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      
      <!-- Customer Name -->
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-user text-green-500 mr-1"></i> ඔබගේ නම / Name / பெயர்
        </label>
        <input type="text" id="customerName" required placeholder="Enter full name" class="w-full p-2.5 rounded-lg border text-sm">
      </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-phone text-green-500 mr-1"></i> දුරකථන අංකය / WhatsApp Phone No
        </label>
        <input type="tel" id="phoneNumber" required placeholder="e.g. 0771234567" class="w-full p-2.5 rounded-lg border text-sm">
      </div>

      <!-- Device Type -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-laptop text-green-500 mr-1"></i> Device Type
          </label>
          <select id="deviceType" required class="w-full p-2.5 rounded-lg border text-sm">
            <option value="">Select Device</option>
            <option value="Laptop">Laptop (ලැප්ටොප්)</option>
            <option value="Desktop PC">Desktop PC (පරිගණකය)</option>
            <option value="Motherboard">Motherboard Only</option>
            <option value="VGA / GPU">VGA / Graphics Card</option>
            <option value="Other">Other Electronic Device</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-microchip text-green-500 mr-1"></i> Model / Brand (Optional)
          </label>
          <input type="text" id="deviceModel" placeholder="e.g. ASUS TUF / Core i5" class="w-full p-2.5 rounded-lg border text-sm">
        </div>
      </div>

      <!-- Fault Description -->
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-wrench text-green-500 mr-1"></i> දෝෂය / Issue Description
        </label>
        <textarea id="faultDescription" rows="3" required placeholder="No Power, Auto Restart, Display Issue, Overheating etc." class="w-full p-2.5 rounded-lg border text-sm"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 text-black text-sm font-bold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2 cursor-pointer mt-6">
        <i class="fa-solid fa-paper-plane"></i> SUBMIT BOOKING REQUEST
      </button>

    </form>

    <!-- Success / Error Message Display -->
    <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg text-center text-sm font-semibold"></div>

  </div>

  <footer class="text-center text-xs text-gray-500 mt-2">
    &copy; Sky Technologies Kadawatha. All rights reserved.
  </footer>

  <script>
    // New Web App Script URL Integrated
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwnOGnzOz-dNVv1TMvtcDPpLu45VdSiYHXHZ4g7pg4qTgfv29NJvpRiXWkAnPOiHqrv1w/exec';

    async function handleFormSubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> GENERATING TICKET...`;
      statusMessage.className = 'hidden';

      const customerName = document.getElementById('customerName').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const deviceType = document.getElementById('deviceType').value;
      const deviceModel = document.getElementById('deviceModel').value.trim();
      const faultDescription = document.getElementById('faultDescription').value.trim();

      // Form Data (CORS preflight bypass)
      const formData = new URLSearchParams();
      formData.append('action', 'createTicket');
      formData.append('customerName', customerName);
      formData.append('phoneNumber', phoneNumber);
      formData.append('deviceType', deviceType);
      formData.append('deviceModel', deviceModel);
      formData.append('faultDescription', faultDescription);

      try {
        const response = await fetch(scriptURL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: formData.toString()
        });

        const result = await response.json();

        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT BOOKING REQUEST`;

        if (result.result === 'success' && result.ticketNumber) {
          const ticketNo = result.ticketNumber; // Google Sheet එකෙන් පැමිණෙන නිවැරදි SKY-TICK-100X අංකය
          const todayDate = new Date().toLocaleDateString();

          statusMessage.className = 'mt-4 p-4 rounded-lg text-center font-semibold bg-green-900/60 text-green-300 border border-green-500';
          statusMessage.innerHTML = `
            <i class="fa-solid fa-circle-check text-2xl text-green-400 mb-2 block"></i>
            <span class="text-base font-bold text-white">ඔබගේ Booking එක සාර්ථකව යොමු කරන ලදී!</span>
            
            <!-- Receipt Container -->
            <div id="receiptContainer" class="mt-4 p-4 bg-slate-900 text-left rounded-lg border border-green-500/50 text-gray-200">
              <div class="text-center border-b border-gray-700 pb-2 mb-3">
                <h3 class="font-brand text-green-400 font-bold text-lg">SKY TECHNOLOGIES</h3>
                <p class="text-xs text-gray-400">Computer & Motherboard Repair Receipt</p>
              </div>
              <div class="space-y-1 text-xs">
                <p><strong class="text-gray-400">Ticket No:</strong> <span class="font-brand text-green-400 font-bold text-sm ml-1">${ticketNo}</span></p>
                <p><strong class="text-gray-400">Date:</strong> ${todayDate}</p>
                <p><strong class="text-gray-400">Name:</strong> ${customerName}</p>
                <p><strong class="text-gray-400">Phone:</strong> ${phoneNumber}</p>
                <p><strong class="text-gray-400">Device:</strong> ${deviceType} ${deviceModel ? '(' + deviceModel + ')' : ''}</p>
                <p><strong class="text-gray-400">Issue:</strong> ${faultDescription}</p>
              </div>
              <div class="mt-3 text-[10px] text-cyan-400 text-center border-t border-gray-800 pt-2">
                * Kadawatha Repair Center - Monday Appointments Only
              </div>
            </div>

            <!-- Download PDF Button -->
            <button onclick="downloadPDF('${ticketNo}')" type="button" class="mt-4 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-4 rounded-lg shadow flex items-center justify-center gap-2 transition text-xs sm:text-sm cursor-pointer">
              <i class="fa-solid fa-file-arrow-down"></i> DOWNLOAD RECEIPT (PDF)
            </button>
          `;
          document.getElementById('bookingForm').reset();
        } else {
          throw new Error(result.error || 'Server processing error');
        }
      } catch (err) {
        console.error('Error submitting booking:', err);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT BOOKING REQUEST`;

        statusMessage.className = 'mt-4 p-4 rounded-lg text-center text-sm font-semibold bg-red-900/60 text-red-300 border border-red-500';
        statusMessage.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> යොමු කිරීම අසාර්ථකයි. කරුණාකර නැවත උත්සාහ කරන්න.`;
      }
    }

    function downloadPDF(ticketNo) {
      const element = document.getElementById('receiptContainer');
      const opt = {
        margin:       0.5,
        filename:     `SKY-Receipt-${ticketNo}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, backgroundColor: '#0f172a' },
        jsPDF:        { unit: 'in', format: 'a5', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
