<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(circle at top, #0b140d 0%, #05080a 50%, #020304 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    .sky-glass-card {
      background: rgba(10, 18, 14, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
      border-radius: 16px;
    }
    .sky-table-row {
      transition: all 0.2s ease-in-out;
    }
    .sky-table-row:hover {
      background: rgba(34, 197, 94, 0.08);
    }
  </style>
</head>
<body class="p-4 sm:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div class="sky-glass-card p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="font-brand text-2xl sm:text-3xl font-extrabold text-white tracking-wider">
          SKY <span class="text-green-500">TECHNOLOGIES</span>
        </h1>
        <p class="text-xs sm:text-sm font-semibold tracking-widest text-cyan-400 uppercase">
          Admin Diagnostics Management Portal
        </p>
      </div>
      <button onclick="fetchTickets()" class="font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-black font-bold px-6 py-2.5 rounded-lg shadow-lg transition cursor-pointer">
        REFRESH DATA
      </button>
    </div>

    <!-- Table Container -->
    <div class="sky-glass-card overflow-hidden">
      <div class="p-4 overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="border-b border-green-900/50 text-gray-400 font-brand text-xs uppercase tracking-wider">
              <th class="p-3">Ticket ID</th>
              <th class="p-3">Date/Time</th>
              <th class="p-3">Customer</th>
              <th class="p-3">Phone</th>
              <th class="p-3">Device & Model</th>
              <th class="p-3">S/N</th>
              <th class="p-3">Fault</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="ticketsTableBody" class="divide-y divide-green-900/30 text-gray-200">
            <tr>
              <td colspan="8" class="text-center py-8 text-gray-400">Loading diagnostics data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // අලුත් Google Apps Script Web App URL එක
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwRSSSQZCjOTuZwHltkFUOw1qA7Ib74zDBKr_RmcVPbusBxu0Hekf6cC6NT9E1-Xz-DOg/exec';

    // Google Sheet එකේ Column H හි ඇති නිවැරදි Ticket Number එකම පෙන්වීම
    function formatTicketNumber(val, rowIndex) {
      if (val && val.toString().trim() !== "") {
        let cleanVal = val.toString().trim();
        return cleanVal.startsWith('SKY-TICK-') ? cleanVal : `SKY-TICK-${cleanVal}`;
      }
      // Backup calculation (Sheet එකේ Ticket ID එකක් නැති වුණොත් පමණි)
      return `SKY-TICK-${1000 + (rowIndex - 1)}`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      try {
        const d = new Date(dateStr);
        return isNaN(d.getTime()) ? dateStr : d.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
      } catch (e) {
        return dateStr;
      }
    }

    function fetchTickets() {
      const tbody = document.getElementById('ticketsTableBody');
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-cyan-400 font-bold">Fetching latest diagnostic tickets...</td></tr>`;

      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-gray-400">No diagnostic tickets found.</td></tr>`;
            return;
          }

          let rowsHtml = '';
          // අලුතෙන්ම ලැබුණු Tickets ඉහලින් පෙන්වීමට Reverse කරනු ලැබේ
          data.reverse().forEach((item) => {
            const ticketDisplay = formatTicketNumber(item.ticketNumber, item.rowIndex);

            rowsHtml += `
              <tr class="sky-table-row">
                <td class="p-3 font-brand font-bold text-green-400 whitespace-nowrap">${ticketDisplay}</td>
                <td class="p-3 text-xs text-gray-400 whitespace-nowrap">${formatDate(item.timestamp)}</td>
                <td class="p-3 font-semibold text-white whitespace-nowrap">${item.customerName || '-'}</td>
                <td class="p-3 font-mono text-cyan-300 whitespace-nowrap">
                  <a href="https://wa.me/${item.phoneNumber}" target="_blank" class="hover:underline">${item.phoneNumber || '-'}</a>
                </td>
                <td class="p-3">
                  <span class="text-emerald-400 font-semibold">${item.deviceType || '-'}</span>
                  <div class="text-xs text-gray-400">${item.deviceModel || '-'}</div>
                </td>
                <td class="p-3 font-mono text-xs text-gray-300">${item.serialNumber || '-'}</td>
                <td class="p-3 text-xs text-gray-300 max-w-xs truncate" title="${item.faultDescription}">${item.faultDescription || '-'}</td>
                <td class="p-3">
                  <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-green-950 text-green-400 border border-green-700">
                    ${item.status || 'New Ticket'}
                  </span>
                </td>
              </tr>
            `;
          });

          tbody.innerHTML = rowsHtml;
        })
        .catch(err => {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-400">Failed to load tickets. Please check Web App URL or permissions.</td></tr>`;
        });
    }

    // Page එක Load වෙද්දීම Data Fetch කිරීම
    window.addEventListener('DOMContentLoaded', fetchTickets);
  </script>
</body>
</html>
