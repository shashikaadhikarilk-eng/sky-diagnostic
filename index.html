<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY TECHNOLOGIES - Job Ticket Form</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Rajdhani', 'Noto Sans Sinhala', sans-serif;
            background: radial-gradient(circle at 20% 20%, #0d1e30 0%, #050b14 100%);
            min-height: 100vh;
        }
        .font-brand { font-family: 'Orbitron', sans-serif; }

        .liquid-glass {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .blob {
            position: absolute;
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4 flex items-center justify-center relative overflow-x-hidden text-slate-100">

    <div class="blob w-96 h-96 bg-emerald-600/20 top-10 -left-20"></div>
    <div class="blob w-96 h-96 bg-cyan-600/20 bottom-10 -right-20"></div>

    <div class="liquid-glass relative z-10 w-full max-w-lg p-6 sm:p-8 rounded-2xl shadow-2xl my-6">
        
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-slate-900/80 border border-emerald-500/50 flex items-center justify-center shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                <i class="fa-solid fa-microchip text-2xl text-emerald-400"></i>
            </div>
            <h1 class="font-brand text-xl sm:text-2xl font-bold text-white tracking-wider">
                SKY <span class="text-emerald-400">TECHNOLOGIES</span>
            </h1>
            <p class="text-xs text-cyan-400 font-semibold uppercase tracking-widest mt-1">Diagnostic Job Form</p>
        </div>

        <form id="jobForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-300 mb-1" for="customerName"><i class="fa-solid fa-user text-emerald-400 mr-1.5"></i>Customer Name</label>
                <input type="text" id="customerName" name="customerName" required class="glass-input w-full px-3.5 py-2.5 rounded-lg text-sm" placeholder="John Doe">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-300 mb-1" for="phoneNumber"><i class="fa-solid fa-phone text-emerald-400 mr-1.5"></i>Phone Number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required class="glass-input w-full px-3.5 py-2.5 rounded-lg text-sm" placeholder="07X XXXXXXX">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-300 mb-1" for="deviceType"><i class="fa-solid fa-laptop text-emerald-400 mr-1.5"></i>Device Type</label>
                    <select id="deviceType" name="deviceType" required class="glass-input w-full px-3.5 py-2.5 rounded-lg text-sm bg-slate-900 text-slate-100">
                        <option value="" class="bg-slate-900 text-slate-400">Select Type</option>
                        <option value="Laptop" class="bg-slate-900">Laptop</option>
                        <option value="Desktop PC" class="bg-slate-900">Desktop PC</option>
                        <option value="Motherboard" class="bg-slate-900">Motherboard</option>
                        <option value="VGA / Graphics Card" class="bg-slate-900">VGA / Graphics Card</option>
                        <option value="Monitor" class="bg-slate-900">Monitor</option>
                        <option value="Other" class="bg-slate-900">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-300 mb-1" for="deviceModel"><i class="fa-solid fa-hashtag text-emerald-400 mr-1.5"></i>Device Model</label>
                    <input type="text" id="deviceModel" name="deviceModel" required class="glass-input w-full px-3.5 py-2.5 rounded-lg text-sm" placeholder="e.g. Asus ROG">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-300 mb-1" for="serialNumber"><i class="fa-solid fa-barcode text-emerald-400 mr-1.5"></i>Serial Number</label>
                <input type="text" id="serialNumber" name="serialNumber" required class="glass-input w-full px-3.5 py-2.5 rounded-lg text-sm" placeholder="S/N or Unique ID">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-300 mb-1" for="faultDescription"><i class="fa-solid fa-triangle-exclamation text-emerald-400 mr-1.5"></i>Fault Description</label>
                <textarea id="faultDescription" name="faultDescription" rows="3" required class="glass-input w-full px-3.5 py-2.5 rounded-lg text-sm resize-none" placeholder="Describe the issue..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="font-brand w-full mt-2 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-sm rounded-lg shadow-[0_0_20px_rgba(34,197,94,0.4)] transition duration-300 transform active:scale-95 cursor-pointer flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> SUBMIT FORM
            </button>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzXixNmTtO4RUT6xv0oEcHYQ73_x-lXfVkFKqYGmNcXI8pqYtwyoBpHByvTDYDQ-2t0/exec';
        const myWhatsAppNumber = '94764117935';

        document.getElementById('jobForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

            const formData = {
                customerName: document.getElementById('customerName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                deviceType: document.getElementById('deviceType').value,
                deviceModel: document.getElementById('deviceModel').value,
                serialNumber: document.getElementById('serialNumber').value,
                faultDescription: document.getElementById('faultDescription').value
            };

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    const ticketNum = data.ticketNumber;
                    alert("Success! Your Ticket Number is: " + ticketNum);

                    const message = encodeURIComponent(`Hello Sky Technology, I have submitted a job form.\n\nTicket Number: ${ticketNum}\nName: ${formData.customerName}\nDevice: ${formData.deviceType} (${formData.deviceModel})\nFault: ${formData.faultDescription}`);
                    window.location.href = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
                } else {
                    alert("Error submitting form: " + (data.error || "Unknown error"));
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> SUBMIT FORM';
                }
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert("Something went wrong. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> SUBMIT FORM';
            });
        });
    </script>
</body>
</html>
