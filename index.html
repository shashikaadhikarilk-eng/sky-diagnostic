<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Technology - Job Ticket Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sky Technology - Diagnostic Job Form</h2>
    <form id="jobForm">
        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" name="customerName" required>
        </div>
        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required>
        </div>
        <div class="form-group">
            <label for="deviceType">Device Type</label>
            <select id="deviceType" name="deviceType" required>
                <option value="">Select Device Type</option>
                <option value="Laptop">Laptop</option>
                <option value="Desktop PC">Desktop PC</option>
                <option value="Motherboard">Motherboard</option>
                <option value="VGA / Graphics Card">VGA / Graphics Card</option>
                <option value="Monitor">Monitor</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="deviceModel">Device Model</label>
            <input type="text" id="deviceModel" name="deviceModel" required>
        </div>
        <div class="form-group">
            <label for="serialNumber">Serial Number</label>
            <input type="text" id="serialNumber" name="serialNumber" required>
        </div>
        <div class="form-group">
            <label for="faultDescription">Fault Description</label>
            <textarea id="faultDescription" name="faultDescription" rows="4" required></textarea>
        </div>
        <button type="submit" id="submitBtn">SUBMIT FORM</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyO8FFhBbu2z2qIwBvkNtF1miW0E5L41Yw5cq_V5e9QqNCxQ-OkQKm6D6zHK9UMP6jirQ/exec';
    const myWhatsAppNumber = '94764117935';

    document.getElementById('jobForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';

        const formData = {
            customerName: document.getElementById('customerName').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            deviceType: document.getElementById('deviceType').value,
            deviceModel: document.getElementById('deviceModel').value,
            serialNumber: document.getElementById('serialNumber').value,
            faultDescription: document.getElementById('faultDescription').value
        };

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'success') {
                const ticketNum = data.ticketNumber;
                alert("Success! Your Ticket Number is: " + ticketNum);

                // WhatsApp redirection
                const message = encodeURIComponent(`Hello Sky Technology, I have submitted a job form.\n\nTicket Number: ${ticketNum}\nName: ${formData.customerName}\nDevice: ${formData.deviceType} (${formData.deviceModel})\nFault: ${formData.faultDescription}`);
                window.location.href = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
            } else {
                alert("Error submitting form: " + (data.error || "Unknown error"));
                submitBtn.disabled = false;
                submitBtn.innerText = 'SUBMIT FORM';
            }
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert("Something went wrong. Please try again.");
            submitBtn.disabled = false;
            submitBtn.innerText = 'SUBMIT FORM';
        });
    });
</script>

</body>
</html>
