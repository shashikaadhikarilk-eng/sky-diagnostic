<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY TECHNOLOGIES - Repair Helpdesk & Live Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: 'Rajdhani', 'Noto Sans Sinhala', sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, #090d12 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    .font-brand { font-family: 'Orbitron', sans-serif; }
    
    .glass-card {
      background: rgba(17, 24, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    }
    
    .logo-glow {
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    }

    input, select, textarea {
      background: rgba(9, 13, 18, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
      color: #ffffff !important;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #22c55e !important;
      outline: none !important;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4) !important;
    }
  </style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center justify-center min-h-screen">

  <div class="w-full max-w-xl glass-card rounded-2xl p-5 sm:p-8 my-4">
    
    <!-- Header Section -->
    <div class="text-center mb-6 border-b border-gray-800 pb-5">
      <div class="w-16 h-16 rounded-full bg-black border-2 border-green-500 overflow-hidden logo-glow mx-auto mb-3 flex items-center justify-center">
        <span class="font-brand text-green-400 font-bold text-sm">SKY</span>
      </div>
      <h1 class="font-brand text-xl sm:text-2xl font-extrabold text-white tracking-wider">
        SKY <span class="text-green-500">TECHNOLOGIES</span>
      </h1>
      <p class="text-xs sm:text-sm text-cyan-400 font-semibold tracking-wider mt-1">REPAIR HELPDESK & LIVE TRACKING</p>
      <p class="text-gray-400 text-xs mt-1">කඩවත | Monday Service Only (Appointment Required)</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-800 mb-6 text-sm font-bold">
      <button id="tabBook" onclick="switchTab('book')" class="flex-1 py-2 text-center text-green-400 border-b-2 border-green-500 transition cursor-pointer">
        <i class="fa-solid fa-calendar-plus mr-1"></i> New Repair Booking
      </button>
      <button id="tabTrack" onclick="switchTab('track')" class="flex-1 py-2 text-center text-gray-400 border-b-2 border-transparent hover:text-white transition cursor-pointer">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Track Repair Status
      </button>
    </div>

    <!-- SECTION 1: BOOKING FORM -->
    <div id="bookingSection">
      <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-user text-green-500 mr-1"></i> ඔබගේ නම / Name
          </label>
          <input type="text" id="customerName" required placeholder="Enter full name" class="w-full p-2.5 rounded-xl border text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-phone text-green-500 mr-1"></i> දුරකථන අංකය / WhatsApp No
          </label>
          <input type="tel" id="phoneNumber" required placeholder="e.g. 0771234567" class="w-full p-2.5 rounded-xl border text-sm">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
              <i class="fa-solid fa-laptop text-green-500 mr-1"></i> Device Type
            </label>
            <select id="deviceType" required class="w-full p-2.5 rounded-xl border text-sm">
              <option value="">Select Device</option>
              <option value="Laptop">Laptop (ලැප්ටොප්)</option>
              <option value="Desktop PC">Desktop PC (පරිගණකය)</option>
              <option value="Motherboard">Motherboard Only</option>
              <option value="VGA / GPU">VGA / Graphics Card</option>
              <option value="Other">Other Electronic Device</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
              <i class="fa-solid fa-microchip text-green-500 mr-1"></i> Model / Brand
            </label>
            <input type="text" id="deviceModel" placeholder="e.g. ASUS TUF / Core i5" class="w-full p-2.5 rounded-xl border text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-barcode text-green-500 mr-1"></i> Serial Number / Tag (Optional)
          </label>
          <input type="text" id="serialNumber" placeholder="e.g. SN-9876543210" class="w-full p-2.5 rounded-xl border text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-wrench text-green-500 mr-1"></i> දෝෂය / Issue Description
          </label>
          <textarea id="faultDescription" rows="3" required placeholder="No Power, Auto Restart, Display Issue, Overheating etc." class="w-full p-2.5 rounded-xl border text-sm"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full font-brand bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 text-black text-sm font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer mt-6">
          <i class="fa-solid fa-paper-plane"></i> SUBMIT BOOKING REQUEST
        </button>
      </form>
    </div>

    <!-- SECTION 2: LIVE TRACKING SECTION -->
    <div id="trackingSection" class="hidden space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-ticket text-cyan-400 mr-1"></i> Enter Ticket Number
        </label>
        <div class="flex gap-2">
          <input type="text" id="searchTicketNo" placeholder="e.g. SKY-TICK-1001" class="w-full p-2.5 rounded-xl border text-sm uppercase">
          <button onclick="trackStatus()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-5 py-2.5 rounded-xl transition text-xs flex items-center gap-1 cursor-pointer shadow">
            <i class="fa-solid fa-search"></i> SEARCH
          </button>
        </div>
      </div>

      <div id="trackingResult" class="hidden p-4 rounded-xl bg-slate-900/90 border border-cyan-500/40 text-xs space-y-2 shadow-lg">
        <!-- Live tracking result -->
      </div>
    </div>

    <div id="statusMessage" class="hidden mt-4 p-4 rounded-xl text-center text-sm font-semibold"></div>

  </div>

  <footer class="text-center text-xs text-gray-500 mt-2">
    &copy; Sky Technologies Kadawatha. All rights reserved.
  </footer>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxWC38ihOONsWLWBMQdEe8HnSd4t56PQ42Ku3jRyTqXy592Dr2CjmxYYx3TIgLF3bGTpA/exec';

    function switchTab(tab) {
      const bookSec = document.getElementById('bookingSection');
      const trackSec = document.getElementById('trackingSection');
      const tabBook = document.getElementById('tabBook');
      const tabTrack = document.getElementById('tabTrack');
      const statusMessage = document.getElementById('statusMessage');

      statusMessage.className = 'hidden';

      if (tab === 'book') {
        bookSec.classList.remove('hidden');
        trackSec.classList.add('hidden');
        tabBook.className = 'flex-1 py-2 text-center text-green-400 border-b-2 border-green-500 transition cursor-pointer';
        tabTrack.className = 'flex-1 py-2 text-center text-gray-400 border-b-2 border-transparent hover:text-white transition cursor-pointer';
      } else {
        bookSec.classList.add('hidden');
        trackSec.classList.remove('hidden');
        tabTrack.className = 'flex-1 py-2 text-center text-cyan-400 border-b-2 border-cyan-500 transition cursor-pointer';
        tabBook.className = 'flex-1 py-2 text-center text-gray-400 border-b-2 border-transparent hover:text-white transition cursor-pointer';
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> GENERATING TICKET...`;
      statusMessage.className = 'hidden';

      const customerName = document.getElementById('customerName').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const deviceType = document.getElementById('deviceType').value;
      const deviceModel = document.getElementById('deviceModel').value.trim();
      const serialNumber = document.getElementById('serialNumber').value.trim() || 'N/A';
      const faultDescription = document.getElementById('faultDescription').value.trim();

      const formData = new URLSearchParams();
      formData.append('action', 'createTicket');
      formData.append('customerName', customerName);
      formData.append('phoneNumber', phoneNumber);
      formData.append('deviceType', deviceType);
      formData.append('deviceModel', deviceModel);
      formData.append('serialNumber', serialNumber);
      formData.append('faultDescription', faultDescription);

      try {
        const response = await fetch(scriptURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        const result = await response.json();

        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT BOOKING REQUEST`;

        if (result.result === 'success' && result.ticketNumber) {
          const ticketNo = result.ticketNumber;
          const todayDate = new Date().toLocaleDateString();

          statusMessage.className = 'mt-4 p-4 rounded-xl text-center font-semibold bg-green-950/80 text-green-300 border border-green-500';
          statusMessage.innerHTML = `
            <i class="fa-solid fa-circle-check text-2xl text-green-400 mb-2 block"></i>
            <span class="text-base font-bold text-white">ඔබගේ Booking එක සාර්ථකව යොමු කරන ලදී!</span>
            
            <div id="receiptContainer" class="mt-4 p-4 bg-slate-900 text-left rounded-xl border border-green-500/50 text-gray-200">
              <div class="text-center border-b border-gray-700 pb-2 mb-3">
                <h3 class="font-brand text-green-400 font-bold text-lg">SKY TECHNOLOGIES</h3>
                <p class="text-xs text-gray-400">Computer & Motherboard Repair Receipt</p>
              </div>
              <div class="space-y-1 text-xs">
                <p><strong class="text-gray-400">Ticket No:</strong> <span class="font-brand text-green-400 font-bold text-sm ml-1">${ticketNo}</span></p>
                <p><strong class="text-gray-400">Date:</strong> ${todayDate}</p>
                <p><strong class="text-gray-400">Name:</strong> ${customerName}</p>
                <p><strong class="text-gray-400">Phone:</strong> ${phoneNumber}</p>
                <p><strong class="text-gray-400">Device:</strong> ${deviceType} ${deviceModel ? '(' + deviceModel + ')' : ''}</p>
                <p><strong class="text-gray-400">Serial No:</strong> ${serialNumber}</p>
                <p><strong class="text-gray-400">Issue:</strong> ${faultDescription}</p>
              </div>
              <div class="mt-3 text-[10px] text-cyan-400 text-center border-t border-gray-800 pt-2">
                * Kadawatha Repair Center - Monday Appointments Only
              </div>
            </div>

            <button onclick="downloadPDF('${ticketNo}')" type="button" class="mt-4 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-xl shadow flex items-center justify-center gap-2 transition text-xs sm:text-sm cursor-pointer">
              <i class="fa-solid fa-file-arrow-down"></i> DOWNLOAD RECEIPT (PDF)
            </button>
          `;
          document.getElementById('bookingForm').reset();
        } else {
          throw new Error(result.error || 'Server error');
        }
      } catch (err) {
        console.error('Error submitting booking:', err);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT BOOKING REQUEST`;

        statusMessage.className = 'mt-4 p-4 rounded-xl text-center text-sm font-semibold bg-red-950/80 text-red-300 border border-red-500';
        statusMessage.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> යොමු කිරීම අසාර්ථකයි. කරුණාකර නැවත උත්සාහ කරන්න.`;
      }
    }

    function downloadPDF(ticketNo) {
      const element = document.getElementById('receiptContainer');
      if (!element) return;
      const opt = {
        margin:       0.5,
        filename:     `SKY-Receipt-${ticketNo}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, backgroundColor: '#0f172a', useCORS: true },
        jsPDF:        { unit: 'in', format: 'a5', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    async function trackStatus() {
      const searchTicket = document.getElementById('searchTicketNo').value.trim().toUpperCase();
      const trackingResult = document.getElementById('trackingResult');

      if (!searchTicket) {
        alert('කරුණාකර Ticket Number එකක් ඇතුළත් කරන්න (e.g. SKY-TICK-1001)');
        return;
      }

      trackingResult.classList.remove('hidden');
      trackingResult.innerHTML = `<p class="text-center text-cyan-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Fetching Live Status...</p>`;

      try {
        const response = await fetch(scriptURL + '?t=' + new Date().getTime());
        const data = await response.json();

        const ticket = data.find(item => item.ticketNumber && item.ticketNumber.toString().toUpperCase() === searchTicket);

        if (ticket) {
          let statusText = ticket.status ? ticket.status.toString().trim() : 'New Ticket';
          let statusBadge = 'bg-blue-600 text-white';

          if (statusText.toLowerCase().includes('progress')) statusBadge = 'bg-yellow-600 text-black font-bold';
          else if (statusText.toLowerCase().includes('parts pending')) statusBadge = 'bg-orange-600 text-white';
          else if (statusText.toLowerCase().includes('ready')) statusBadge = 'bg-emerald-600 text-white';
          else if (statusText.toLowerCase().includes('completed')) statusBadge = 'bg-green-600 text-white';

          trackingResult.innerHTML = `
            <div class="border-b border-gray-700 pb-2 mb-2 flex justify-between items-center">
              <span class="font-brand text-green-400 font-bold text-sm">${ticket.ticketNumber}</span>
              <span class="px-2.5 py-1 rounded-lg text-[11px] font-bold uppercase tracking-wider ${statusBadge}">${statusText}</span>
            </div>
            <div class="space-y-1 text-gray-200">
              <p><strong class="text-gray-400">Customer Name:</strong> ${ticket.customerName}</p>
              <p><strong class="text-gray-400">Device & Model:</strong> ${ticket.deviceType} ${ticket.deviceModel ? '(' + ticket.deviceModel + ')' : ''}</p>
              <p><strong class="text-gray-400">Serial No:</strong> ${ticket.serialNumber || 'N/A'}</p>
              <p><strong class="text-gray-400">Fault / Note:</strong> ${ticket.faultDescription}</p>
            </div>
            <div class="mt-3 text-[10px] text-cyan-400 text-center border-t border-gray-800 pt-2">
              * Live Status syncs directly from Sky Technologies Admin Sheet.
            </div>
          `;
        } else {
          trackingResult.innerHTML = `<p class="text-center text-red-400 font-bold"><i class="fa-solid fa-circle-xmark mr-1"></i> Ticket Number Not Found!</p>`;
        }
      } catch (err) {
        console.error('Error fetching status:', err);
        trackingResult.innerHTML = `<p class="text-center text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Status Check Failed. Try again later.</p>`;
      }
    }
  </script>
</body>
</html>
